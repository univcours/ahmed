name: Chef Ahmed - Facebook refresh authorization check
on:
  push:
    branches: [main]
    paths:
      - 'tools/chefahmed/facebook-refresh-scan.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only check of Chef Ahmed Facebook Page credential
        env:
          CHEF_AHMED_PAGE_TOKEN: ${{ secrets.CHEF_AHMED_PAGE_TOKEN }}
        run: python tools/chefahmed/facebook-refresh-scan.py
