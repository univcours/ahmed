name: Chef Ahmed - authentic natural kitchen photo retouch
on:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/clean_natural_surfaces.py
      - .github/workflows/chef-ahmed-natural-clean.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chef-ahmed-natural-clean
  cancel-in-progress: false
jobs:
  photo-preview:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-segmentation and retouch dependencies
        run: python -m pip install --disable-pip-version-check 'rembg[cpu]>=2.0.65,<3' 'opencv-python-headless>=4.8,<5' 'numpy<3' 'Pillow>=10,<12'
      - name: Prepare eight-source before/after preview without changing menu or source images
        run: python tools/chefahmed/clean_natural_surfaces.py --preview --limit 8
      - name: Save updated comparison under unique name for review
        run: |
          mv social/cleaned/natural-preview.jpg social/cleaned/natural-preview-v2.jpg
          mv social/cleaned/natural-preview.json social/cleaned/natural-preview-v2.json
      - name: Commit photo preview for inspection
        run: |
          set -euo pipefail
          git config user.name "chef-ahmed-photo-cleanup[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preview script also writes temporary samples; keep them out of the commit.
          git restore -- social/cleaned/natural-preview.jpg social/cleaned/natural-preview.json || true
          rm -f social/cleaned/natural-[0-9][0-9].jpg
          git add social/cleaned/natural-preview-v2.jpg social/cleaned/natural-preview-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Preview real-food-only cleanup before publishing kitchen surfaces"
            git pull --rebase origin main
            git push
          fi
