name: Chef Ahmed - publish authentic food photos on cleaned surfaces
on:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/clean_natural_surfaces.py
      - .github/workflows/chef-ahmed-natural-clean.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chef-ahmed-natural-clean
  cancel-in-progress: false
jobs:
  retouch-and-publish:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout original real photos
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conservative photo masking tools
        run: python -m pip install --disable-pip-version-check 'rembg[cpu]>=2.0.65,<3' 'opencv-python-headless>=4.8,<5' 'numpy<3' 'Pillow>=10,<12'
      - name: Clean only photographed dish surroundings, keep the real meal and serving platter
        run: python tools/chefahmed/clean_natural_surfaces.py
      - name: Verify every referenced cleaned file, output image and original
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          menu=json.loads(Path('menu.json').read_text(encoding='utf-8'))
          report=json.loads(Path('social/cleaned/natural-manifest.json').read_text(encoding='utf-8'))
          entries=report['images']
          assert len(entries) >= 40, 'Unexpectedly small catalog'
          count=0
          for record in entries:
              src=Path(record['original'])
              assert src.is_file(), 'Original lost: '+str(src)
              clean=record['clean']
              if clean:
                  assert clean == menu['items'][record['original']].get('cleaned_image')
                  out=Path(clean)
                  assert out.is_file(), 'Cleaned image missing: '+str(out)
                  with Image.open(out) as image:
                      image.verify()
                  count+=1
              else:
                  assert not menu['items'][record['original']].get('cleaned_image') or (
                    record['original'] == 'WhatsApp Image 2026-08-28 at 12.17.50 (3).jpeg'
                  ), 'Unsafe prior background still enabled'
          assert count >= 25, 'Safe photo coverage unexpectedly low'
          assert Path('social/cleaned/natural-contact-sheet.jpg').is_file()
          print('PASS: all original food/photos exist; cleaned:',count,'of',len(entries))
          PY
      - name: Commit reviewed cleaned food-only photo copies and catalog references
        run: |
          set -euo pipefail
          git config user.name "chef-ahmed-natural-photo[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json social/cleaned/natural-*.jpg social/cleaned/natural-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Clean floor and table surroundings in authentic dish photos; retain all originals"
            git pull --rebase origin main
            git push
          fi
