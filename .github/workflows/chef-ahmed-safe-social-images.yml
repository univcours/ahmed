name: Chef Ahmed - make uncropped Facebook square cards
on:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/fix_social_crops.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - run: python tools/chefahmed/fix_social_crops.py
      - name: Commit safe full-frame images
        run: |
          git config user.name "chef-ahmed-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/facebook-safe/
          if ! git diff --cached --quiet; then
            git commit -m "Add full-frame Facebook designs with zero cropped content"
            git push
          fi
