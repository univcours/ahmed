name: Chef Ahmed - official Facebook cover update
on:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/set-cover-trigger.txt
      - tools/chefahmed/set_cover.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chef-ahmed-cover
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Install cover artwork and attempt Meta Page cover change
        env:
          CHEF_AHMED_PAGE_TOKEN: ${{ secrets.CHEF_AHMED_PAGE_TOKEN }}
        run: python tools/chefahmed/set_cover.py
      - name: Commit cover artwork and verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chef-ahmed-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/chef-ahmed-facebook-cover.jpg social/cover-update-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Chef Ahmed cover and verified Page update status"
            git push
          fi
