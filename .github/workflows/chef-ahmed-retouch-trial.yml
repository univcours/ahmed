name: Chef Ahmed - inspect clean food background result
on:
  push:
    branches: [main]
    paths: [tools/chefahmed/retouch_trial.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Pillow>=10,<12"
      - run: python tools/chefahmed/retouch_trial.py
      - name: Commit QA image preview only
        run: |
          git config user.name "chef-ahmed-retouch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/audit/seafood-salad-bg-trial.jpg social/audit/seafood-salad-before-after.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Stage clean food background trial and visual comparison"
            git push
          fi
