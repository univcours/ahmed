name: Chef Ahmed - sharpen low-resolution public photos
on:
  push:
    branches: [main]
    paths:
      - 'tools/chefahmed/upscale_portraits.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sharpen:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image enhancement dependencies
        run: python -m pip install 'numpy<3' 'Pillow>=10,<12' 'opencv-contrib-python-headless>=4.9,<5'
      - name: Restore natural image detail without fabricating content
        run: python tools/chefahmed/upscale_portraits.py
      - name: Check public site and commit higher-quality versions
        shell: bash
        run: |
          set -euo pipefail
          node tools/chefahmed/site_qa.js
          git config user.name "chef-ahmed-quality[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json social/cleaned/chef-ahmed-moroccan-feast-sharp.webp social/cleaned/chef-ahmed-wedding-service-sharp.webp
          if ! git diff --cached --quiet; then
            git commit -m "Improve portrait detail and publish sharper website image versions"
            git pull --rebase origin main
            git push
          fi
