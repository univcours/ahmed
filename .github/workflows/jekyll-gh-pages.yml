# Legacy Jekyll workflow retained as a read-only notice.
# The actual Pages site is a static HTML app and is deployed only by static.yml.
name: Chef Ahmed - Jekyll deployment retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Do not deploy a second competing GitHub Pages site
        run: echo "Use Deploy static content to Pages (static.yml) for the site."
