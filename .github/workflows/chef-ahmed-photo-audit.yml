name: Chef Ahmed - audit catalog photo framing
on:
  push:
    branches: [main]
    paths: [tools/chefahmed/audit_menu_images.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Pillow>=10,<12"
      - name: Create photo contact sheet for review
        run: python tools/chefahmed/audit_menu_images.py
      - name: Save visual audit files
        run: |
          git config user.name "chef-ahmed-photo-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/audit/
          if ! git diff --cached --quiet; then
            git commit -m "Audit original menu photos and image aspect ratios"
            git push
          fi
