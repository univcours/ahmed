name: Chef Ahmed - visual preview of luxury site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/capture_site.sh
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture with headless Chrome
        run: bash tools/chefahmed/capture_site.sh
      - name: Save QA screenshots
        run: |
          set -e
          git config user.name "chef-ahmed-site-preview[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/audit/luxury-desktop.png social/audit/luxury-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "Capture luxury website desktop and mobile screenshots"
            git push
          fi
