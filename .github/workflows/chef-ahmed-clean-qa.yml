name: Chef Ahmed - verify full clean photo collection
on:
  push:
    branches: [main]
    paths: [tools/chefahmed/qa_clean_gallery.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Pillow>=10,<12"
      - run: python tools/chefahmed/qa_clean_gallery.py
      - name: Save verified image contact sheet
        run: |
          git config user.name "chef-ahmed-clean-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/cleaned/preview-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publish visual preview of 16 cleaned authentic food photos"
            git pull --rebase origin main
            git push
          fi
