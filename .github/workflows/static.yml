name: Chef Ahmed - deploy verified public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
      - name: Setup Node.js for site QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript, menu, photo assets and fallback
        run: node tools/chefahmed/site_qa.js
      - name: Publish only visitor-facing files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _public/share _public/social/cleaned
          cp index.html luxury.css menu.json sitemap.xml robots.txt .nojekyll _public/
          for file in *.jpg *.jpeg *.png *.webp *.gif *.mp4 *.mp3; do
            if [ -f "$file" ]; then cp -- "$file" _public/; fi
          done
          for file in fb-helper.html fb-phone-fix.html fb-posts.html google*.html; do
            if [ -f "$file" ]; then cp -- "$file" _public/; fi
          done
          for file in share/*.html; do
            if [ -f "$file" ]; then cp -- "$file" _public/share/; fi
          done
          for file in social/cleaned/*.jpg social/cleaned/*.jpeg social/cleaned/*.png social/cleaned/*.webp; do
            if [ -f "$file" ]; then cp -- "$file" _public/social/cleaned/; fi
          done
          test -f _public/index.html
          test -f _public/menu.json
          test ! -e _public/token.enc
          test ! -d _public/.github
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload reviewed public bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
