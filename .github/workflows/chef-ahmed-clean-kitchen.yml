name: Chef Ahmed - clean seafood photo and preserve real food
on:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/clean_kitchen_photo.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chef-ahmed-seafood-photo-clean
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing packages
        run: python -m pip install --disable-pip-version-check 'opencv-python-headless>=4.8,<5' 'numpy<3'
      - name: Safely clean the background
        run: python tools/chefahmed/clean_kitchen_photo.py
      - name: Commit original backup and cleaned website photo
        run: |
          git config user.name "chef-ahmed-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "WhatsApp Image 2026-08-28 at 12.17.50 (3).jpeg" social/originals/
          if ! git diff --cached --quiet; then
            git commit -m "Remove trash bin from seafood kitchen photo without changing original food"
            git push
          fi
