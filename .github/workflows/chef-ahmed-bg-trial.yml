name: Chef Ahmed - stage AI background cleanup tests
on:
  push:
    branches: [main]
    paths: [tools/chefahmed/test_clean_backgrounds.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install open-source segmentation packages
        run: python -m pip install --disable-pip-version-check 'rembg[cpu]>=2.0.65,<3' 'opencv-python-headless>=4.8,<5' 'numpy<3'
      - name: Stage original-pixel food compositing
        run: python tools/chefahmed/test_clean_backgrounds.py
      - name: Commit QA artifacts
        run: |
          git config user.name "chef-ahmed-visual-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/audit/bg-trial/
          if ! git diff --cached --quiet; then
            git commit -m "Stage food background cleanup for quality review"
            git push
          fi
