name: Chef Ahmed - generate authentic daily food and chef photo collages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/chefahmed/build_daily_images.py

permissions:
  contents: write

concurrency:
  group: chef-ahmed-build-social-images
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'univcours/ahmed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Build social-ready meals featuring Chef Ahmed
        run: python tools/chefahmed/build_daily_images.py
      - name: Commit only generated food collage images and manifest
        run: |
          git config user.name "chef-ahmed-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/daily-images/
          if ! git diff --cached --quiet; then
            git commit -m "Generate 40 authentic chef and food photo collages"
            git push
          else
            echo "All images already up to date."
          fi
