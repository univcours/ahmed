name: Chef Ahmed - publish clean catering food gallery
on:
  push:
    branches: [main]
    paths: [tools/chefahmed/clean_food_gallery.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chef-ahmed-clean-production
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare original-food preservation toolchain
        run: python -m pip install --disable-pip-version-check 'rembg[cpu]>=2.0.65,<3' 'opencv-python-headless>=4.8,<5' 'numpy<3'
      - name: Produce validated clean food photos and manifest
        run: python tools/chefahmed/clean_food_gallery.py
      - name: Commit independent cleaned photos and update menu display
        run: |
          set -euo pipefail
          git config user.name "chef-ahmed-clean-gallery[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/cleaned/ menu.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace dirty food backdrops with clean studio surfaces; preserve original photos"
            git pull --rebase origin main
            git push
          fi
