  /* ---------- نصوص الواجهة ---------- */
  const T = {

    heroSub:['وجبات طازجة محضّرة بحب. اختر، اطلب عبر واتساب، ونوصلها إلى بابك.','Fresh meals made with love. Choose, order on WhatsApp, delivered to your door.'],

    search:['ابحث عن وجبة…','Search for a dish…'],
    all:['الكل','All'],
    add:['أضف إلى السلة','Add to cart'],
    added:['✅ أُضيفت إلى السلة','✅ Added to cart'],
    cart:['🧺 السلة','🧺 Cart'], cartTitle:['🧺 سلتك','🧺 Your cart'],
    cartEmpty:['سلتك فارغة — أضف بعض الوجبات الشهية 😋','Your cart is empty — add some tasty dishes 😋'],
    total:['المجموع','Total'],
    delivery:['🛵 معلومات التوصيل','🛵 Delivery details'],
    name:['الاسم الكامل *','Full name *'], phone:['رقم الهاتف *','Phone number *'],
    address:['عنوان التوصيل *','Delivery address *'], notes:['ملاحظات (اختياري)','Notes (optional)'],
    notesPh:['مثال: بدون بصل','e.g. no onions'],
    cod:['الدفع نقداً عند الاستلام — لا حاجة لبطاقة بنكية.','Cash on delivery — no bank card needed.'],
    waOrder:['أرسل الطلب عبر واتساب','Send order on WhatsApp'],
    fillAll:['⚠️ املأ الاسم والهاتف والعنوان','⚠️ Please fill name, phone and address'],
    admin:['👤 المدير','👤 Admin'], adminLogin:['👤 دخول المدير','👤 Admin login'],
    pin:['الرمز السري','PIN code'], login:['دخول','Log in'], wrongPin:['الرمز غير صحيح','Wrong PIN'],
    noHashMsg:['لم تُضبط بصمة الرمز السري بعد. ولّد بصمة بالأسفل ثم الصقها في CONFIG.adminPinHash داخل الملف.','No PIN hash is set yet. Generate one below then paste it into CONFIG.adminPinHash inside the file.'],
    genTitle:['🔑 توليد بصمة رمز سري','🔑 Generate a PIN hash'],
    genPh:['اكتب الرمز السري الذي تريده','Type the PIN you want'],
    genBtn:['ولّد البصمة','Generate hash'],
    genHint:['انسخ السطر الناتج وضعه مكان adminPinHash في أول الملف. البصمة لا يمكن عكسها لمعرفة الرمز.','Copy the resulting line and paste it as adminPinHash at the top of the file. The hash cannot be reversed to reveal the PIN.'],
    adminOn:['🛠️ وضع المدير مفعّل — اضغط ✏️ على أي وجبة لتعديلها','🛠️ Admin mode — press ✏️ on any dish to edit'],
    logout:['خروج','Log out'], refresh:['🔄 تحديث الصور','🔄 Refresh photos'],
    save:['💾 حفظ','💾 Save'], saved:['💾 تم الحفظ','💾 Saved'], cancel:['إلغاء','Cancel'],
    hide:['إخفاء هذه الوجبة عن الزوار','Hide this dish from visitors'], hidden:['مخفية','hidden'],
    nameAr:['اسم الوجبة (عربي)','Dish name (Arabic)'], nameEn:['اسم الوجبة (إنجليزي)','Dish name (English)'],
    descAr:['الوصف (عربي)','Description (Arabic)'], descEn:['الوصف (إنجليزي)','Description (English)'],
    price:['السعر','Price'], category:['التصنيف (اختياري)','Category (optional)'],
    noResults:['لا نتائج مطابقة','No matching results'],
    tryOther:['جرّب كلمة أخرى.','Try another word.'],
    noDishes:['لا توجد وجبات بعد','No dishes yet'],
    addToRepo:['أضف صور وجباتك إلى مجلد GitHub وستظهر هنا تلقائياً.','Add your dish photos to the GitHub folder and they will appear here automatically.'],
    footer:['💵 الدفع نقداً عند الاستلام · الصور تُحدَّث تلقائياً من مجلد GitHub','💵 Cash on delivery · Photos update automatically from the GitHub folder'],
    noRepo:['⚙️ لم يتم ضبط رابط المستودع بعد — افتح الملف وضع رابط مجلد صورك في CONFIG.repoUrl في أول الملف.','⚙️ Repo link not set — open the file and put your photos folder link in CONFIG.repoUrl at the top.'],
    stToken:['رمز GitHub للحفظ في المستودع (اختياري)','GitHub token to save into the repo (optional)'],
    stTokenHint:['GitHub → Settings → Developer settings → Fine-grained tokens، صلاحية Contents: Read and write على هذا المستودع فقط.','GitHub → Settings → Developer settings → Fine-grained tokens, Contents: Read and write on this repo only.'],
    settings:['⚙️ الإعدادات','⚙️ Settings'],
    pushRepo:['⬆️ احفظ القائمة في المستودع','⬆️ Save menu to repo'],
    pushed:['✅ تم الحفظ في المستودع','✅ Saved to repo'],
    pushFail:['⚠️ تعذر الحفظ — تحقق من الرمز وصلاحياته','⚠️ Save failed — check token & permissions'],
    noToken:['أضف رمز GitHub أولاً من الإعدادات','Add a GitHub token first in Settings'],
    orderMsgTitle:['🛒 طلب جديد من','🛒 New order from'],
    customer:['الزبون','Customer'], codShort:['الدفع عند الاستلام','cash on delivery'],
    thanks:['شكراً! سنؤكد طلبك على واتساب.','Thank you! We will confirm your order on WhatsApp.'],
    dirham:[CONFIG.currency, CONFIG.currencyEn],
  };
  const t = k => T[k][S.lang==='ar'?0:1];

  /* ---------- الحالة ---------- */
  const S = {
    lang:'ar', cfg:null, ready:false,
    data:{ items:{} },        // تعديلات المدير من menu.json
    files:[], chefImgs:[], error:'', loadingList:true,
    cat:'الكل', q:'', cart:{}, admin:false, editing:null, modal:null, lightbox:null,
    dirty:false, saving:false, ghToken:'',
  };

  /* ---------- تخزين آمن (يعمل حتى بدون window.storage) ---------- */
  const mem = {};
  async function sGet(k, shared=true){
    try{ if (window.storage){ const r = await window.storage.get(k, shared); return r ? JSON.parse(r.value) : null; } }catch(e){}
    return mem[k] ?? null;
  }
  async function sSet(k, v, shared=true){
    mem[k] = v;
    try{ if (window.storage) await window.storage.set(k, JSON.stringify(v), shared); }catch(e){}
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function sha256(s){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2500); }
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

  /* اسم افتراضي جميل من اسم الملف: meals/tajine-lham_2.jpg → Tajine lham */
  const baseName = p => String(p).split('/').pop();
  function prettyName(file){
    let n = baseName(file).replace(IMG_EXT,'').replace(/[-_]+/g,' ').replace(/\s+\d+$/,'').trim();
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  const itemOf = f => S.data.items[f.name] || {};
  const iname = (f) => { const it=itemOf(f); return (S.lang==='ar' ? (it.name_ar||it.name_en) : (it.name_en||it.name_ar)) || prettyName(f.name); };
  const idesc = (f) => { const it=itemOf(f); return (S.lang==='ar' ? (it.desc_ar||'') : (it.desc_en||'')); };
  const iprice = f => Number(itemOf(f).price) || 0;

  function parseRepoUrl(url){
    try{
      let u = url.trim().replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\/+$/,'');
      const p = u.split('/').filter(Boolean);
      if (p.length < 2) return null;
      const owner=p[0], repo=p[1]; let branch='main', path='';
      if (p[2]==='tree' && p.length>3){ branch=p[3]; path=p.slice(4).join('/'); }
      else if (p.length>2){ path=p.slice(2).join('/'); }
      return {owner,repo,branch,path};
    }catch(e){ return null; }
  }
  const menuPath = () => (S.cfg.path ? S.cfg.path + '/' : '') + MENU_FILE;

  /* ---------- GitHub ---------- */
  async function listImages(cfg){
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(S.lang==='ar'
      ? 'تعذر جلب الصور — تأكد أن الرابط صحيح وأن المستودع عام (Public)'
      : 'Could not load photos — check the link and that the repo is Public');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(S.lang==='ar' ? 'الرابط لا يشير إلى مجلد' : 'Link is not a folder');
    return data.filter(f => f.type==='file' && IMG_EXT.test(f.name)).map(f => ({name:f.name, url:f.download_url}));
  }

  async function loadRepoMenu(){
    try{
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`);
      if (!res.ok) return null;
      const j = await res.json();
      return JSON.parse(b64dec(j.content));
    }catch(e){ return null; }
  }

  async function pushRepoMenu(){
    const token = S.ghToken || await sGet('gh_token', false);
    if (!token) return {ok:false, reason:'no_token'};
    S.saving = true; render();
    try{
      const head = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`,
        { headers:{ Authorization:'Bearer '+token } });
      let sha = null;
      if (head.ok) sha = (await head.json()).sha;
      const body = { message:'Update menu from website', branch:S.cfg.branch, content:b64enc(JSON.stringify(S.data,null,2)) };
      if (sha) body.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}`,
        { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      S.saving = false;
      if (!res.ok){ render(); return {ok:false}; }
      S.dirty = false; render();
      return {ok:true};
    }catch(e){ S.saving=false; render(); return {ok:false}; }
  }

  async function persist(){
    S.dirty = true;
    await sSet('data', S.data);
    const r = await pushRepoMenu();
    if (r.ok) toast(t('pushed'));
    render();
  }

  /* ---------- التشغيل ---------- */
  async function boot(){
    S.lang = (await sGet('lang', false)) || 'ar';
    S.ghToken = (await sGet('gh_token', false)) || '';
    // الإعداد: من CONFIG داخل الملف أولاً، ثم من التخزين إن سبق حفظه
    let cfg = CONFIG.repoUrl ? parseRepoUrl(CONFIG.repoUrl) : null;
    if (!cfg) cfg = await sGet('config');
    S.cfg = cfg;
    render();
    if (!S.cfg){ S.loadingList = false; render(); return; }
    // القائمة المعدلة: من المستودع أولاً ثم النسخة المحلية
    const repoData = await loadRepoMenu();
    const backup = await sGet('data');
    S.data = repoData || backup || { items:{} };
    if (!S.data.items) S.data.items = {};
    await refresh();
  }

  async function refresh(){
    S.error=''; S.loadingList = true; render();
    let imgs = [];
    // جرّب main ثم master
    try{ imgs = await listImages(S.cfg); }
    catch(e){
      if (S.cfg.branch === 'main'){
        try{ S.cfg.branch = 'master'; imgs = await listImages(S.cfg); }
        catch(e2){ S.error = e.message; S.loadingList=false; render(); return; }
      } else { S.error = e.message; S.loadingList=false; render(); return; }
    }
    S.chefImgs = imgs.filter(f => CHEF_RE.test(f.name));
    S.files = imgs.filter(f => !CHEF_RE.test(f.name));
    S.loadingList = false;
    render();
  }

  const cartCount = () => Object.values(S.cart).reduce((a,b)=>a+b,0);
  const cartTotal = () => Object.entries(S.cart).reduce((a,[k,q])=>{
    const f = S.files.find(x=>x.name===k); return a + (f?iprice(f):0)*q;
  },0);
  const fileOf = k => S.files.find(f => f.name===k);

  /* ---------- طلب واتساب ---------- */
  function sendWhatsApp(c){
    const num = String(CONFIG.whatsapp||'').replace(/[^\d]/g,'');
    if (!num){ toast('⚠️ ' + (S.lang==='ar'?'لم يُضبط رقم الواتساب في CONFIG':'WhatsApp number not set in CONFIG')); return; }
    const lines = Object.entries(S.cart).map(([k,q]) => {
      const f = fileOf(k);
      return `• ${f?iname(f):k} × ${q} = ${(f?iprice(f):0)*q} ${t('dirham')}`;
    });
    const msg = [
      `${t('orderMsgTitle')} ${S.lang==='ar'?CONFIG.restaurantName:CONFIG.restaurantNameEn}:`,
      ...lines,
      `${t('total')}: *${cartTotal()} ${t('dirham')}* (${t('codShort')})`,
      '',
      `${t('customer')}:`,
      `👤 ${c.name}`, `📞 ${c.phone}`, `📍 ${c.address}`,
      c.notes ? `📝 ${c.notes}` : ''
    ].filter(Boolean).join('\n');
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg), '_blank');
    S.cart = {}; S.modal = null; render(); toast('✅ ' + t('thanks'));
  }

  /* ---------- العرض ---------- */
  function render(){

    const visible = S.files.filter(match);

    ROOT.innerHTML = `

            ? `<button class="iconbtn" id="open-login">${t('admin')}</button>`

          <button class="cartbtn" id="open-cart">${t('cart')}${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button>
        </div>
      </div></div>

      ${S.admin ? `<div class="adminbar">${t('adminOn')}
        <button id="do-refresh2">${t('refresh')}</button>
        ${S.dirty ? `<button id="push-now">${t('pushRepo')}</button>` : ''}
        ${S.saving ? '⏳' : ''}
      </div>` : ''}

      <div class="hero"><div class="hero-in">
        <span class="tag">${t('slogan')}</span>
        <h1>${esc(restName)}</h1>
        <p>${t('heroSub')}</p>
        <div class="gold-line"></div>
      </div></div>

      <div class="chef"><div class="chef-card">
        ${chef ? `<img src="${esc(chef.url)}" alt="Chef" data-lb-chef="1">` : `<div style="width:104px;height:104px;border-radius:50%;border:4px solid var(--gold);background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:42px;flex-shrink:0">👨‍🍳</div>`}
        <div class="chef-txt">
          <span class="role">${t('chefRole')}</span>
          <h2>${esc(restName)}</h2>
          <p>${esc(welcome)}</p>
        </div>
      </div></div>

      <div class="toolbar"><div class="toolbar-card">
        <div class="search"><span>🔍</span>
          <input id="search-in" placeholder="${t('search')}" value="${esc(S.q)}">
          ${query ? '<button class="xbtn" id="clear-q" style="width:30px;height:30px;font-size:13px">✕</button>' : ''}
        </div>
        ${cats.length ? `<div class="cats">
          <button class="chip ${S.cat==='الكل'?'on':''}" data-cat="الكل">${t('all')}</button>
          ${cats.map(c => `<button class="chip ${S.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>` : ''}
      </div></div>

      ${!S.cfg ? `<div class="notice err">${t('noRepo')}</div>` : ''}
      ${S.error ? `<div class="notice err">⚠️ ${esc(S.error)} <button class="btn ghost" id="retry" style="padding:6px 16px;font-size:13px">🔄</button></div>` : ''}

      <main class="grid">
        ${S.loadingList ? `<div class="empty"><div class="spinner" style="margin:0 auto 14px"></div></div>` : ''}
        ${visible.map((f,i)=>dishHTML(f,i)).join('')}
        ${(!S.loadingList && !visible.length && !S.error && S.cfg) ? `
          <div class="empty">
            <div class="big">${query?'🔍':'🍽️'}</div>
            <h3 style="margin-bottom:6px">${query?t('noResults'):t('noDishes')}</h3>
            <p>${query?t('tryOther'):t('addToRepo')}</p>
          </div>`:''}
      </main>

      <p class="foot">${t('footer')}</p>
      ${modalHTML()}
      ${lightboxHTML()}`;

    bind();
  }

  function dishHTML(f,i){

    const qty = S.cart[f.name] || 0;

    const price = iprice(f);

    const action = editing ? `

        <div class="dish-body">
          <h3>${esc(iname(f))}</h3>

  /* --- عارض الصور --- */

    if (!S.lightbox) return '';

          <div style="display:grid;gap:10px">

            <div class="field"><label>${t('phone')}</label><input class="input" id="c-phone" type="tel" inputmode="tel" dir="ltr" style="text-align:left" autocomplete="tel"></div>

            ${t('waOrder')} — ${cartTotal()} ${t('dirham')}
          </button>` : ''}

    if (S.modal==='login'){

          : `<div class="field"><label>${t('pin')}</label><input class="input" id="pin-in" type="password"></div>
             <p id="pin-err" style="color:var(--red);font-size:14px;margin:8px 0 0"></p>
             <button class="btn" id="pin-go" style="width:100%;margin-top:14px">${t('login')}</button>`}
        <details style="margin-top:14px" ${noHash?'open':''}>
          <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--green)">${t('genTitle')}</summary>
          <div style="display:grid;gap:8px;margin-top:10px">
            <input class="input" id="gen-pin" type="password" placeholder="${t('genPh')}">
            <button class="btn gold" id="gen-go">${t('genBtn')}</button>
            <textarea class="input" id="gen-out" rows="2" readonly dir="ltr" style="text-align:left;font-size:12px;font-family:monospace" onclick="this.select()"></textarea>

          <div class="field"><label>${t('stToken')}</label>
            <input class="input" id="st-token" type="password" dir="ltr" style="text-align:left" placeholder="github_pat_…" value="${esc(S.ghToken)}">

  /* ---------- الأحداث ---------- */
  function bind(){
    const $ = id => document.getElementById(id);
    const all = (sel,fn) => ROOT.querySelectorAll(sel).forEach(fn);

    if ($('lang-toggle')) $('lang-toggle').onclick = async () => {
      S.lang = S.lang==='ar' ? 'en' : 'ar';
      await sSet('lang', S.lang, false);
      render();
    };

    const si = $('search-in');
    if (si){
      let tm;
      si.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { S.q = si.value; render();
        const n=$('search-in'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} }, 300); };
    }
    if ($('clear-q')) $('clear-q').onclick = () => { S.q=''; render(); };

    all('[data-cat]', b => b.onclick = () => { S.cat=b.dataset.cat; render(); });
    all('[data-add]', b => b.onclick = () => { S.cart[b.dataset.add]=1; render(); toast(t('added')); });
    all('[data-inc]', b => b.onclick = () => { S.cart[b.dataset.inc]++; render(); });
    all('[data-dec]', b => b.onclick = () => { const k=b.dataset.dec; S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });
    all('[data-edit]', b => b.onclick = () => { S.editing=b.dataset.edit; render(); });
    all('[data-cancel]', b => b.onclick = () => { S.editing=null; render(); });

    /* تكبير الصور */
    all('[data-lb]', el => el.onclick = () => { S.lightbox = el.dataset.lb; render(); });
    all('[data-lb-chef]', el => el.onclick = () => { S.lightbox = '__chef__'; render(); });
    if ($('lb')){
      $('lb').onclick = () => { S.lightbox = null; render(); };
      document.onkeydown = e => { if (e.key==='Escape' && S.lightbox){ S.lightbox=null; render(); } };
    }

    all('[data-save]', b => b.onclick = async () => {
      const k = b.dataset.save;
      S.data.items[k] = {
        name_ar:$('ed-name-ar').value.trim(), name_en:$('ed-name-en').value.trim(),
        desc_ar:$('ed-desc-ar').value.trim(), desc_en:$('ed-desc-en').value.trim(),
        price:Number($('ed-price').value)||0,
        category:$('ed-cat').value.trim(),
        hidden:$('ed-hidden').checked,
      };
      S.editing=null;
      toast(t('saved'));
      await persist();
    });

    ['do-refresh2','retry'].forEach(id => { if ($(id)) $(id).onclick = refresh; });
    if ($('push-now')) $('push-now').onclick = async () => {
      const r = await pushRepoMenu();
      toast(r.ok ? t('pushed') : (r.reason==='no_token' ? t('noToken') : t('pushFail')));
    };
    if ($('open-cart')) $('open-cart').onclick = () => { S.modal='cart'; render(); };
    if ($('open-login')) $('open-login').onclick = () => { S.modal='login'; render(); };
    if ($('open-settings')) $('open-settings').onclick = () => { S.modal='settings'; render(); };
    if ($('logout')) $('logout').onclick = () => { S.admin=false; S.editing=null; render(); };

    all('.overlay', ov => ov.onclick = e => { if (e.target===ov){ S.modal=null; render(); } });
    all('.sheet [data-close]', b => b.onclick = () => { S.modal=null; render(); });

    all('[data-inc-m]', b => b.onclick = () => { const k=b.getAttribute('data-inc-m'); S.cart[k]++; render(); });
    all('[data-dec-m]', b => b.onclick = () => { const k=b.getAttribute('data-dec-m'); S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });

    if ($('wa-order')) $('wa-order').onclick = function(){
      const c = { name:$('c-name').value.trim(), phone:$('c-phone').value.trim(),
                  address:$('c-addr').value.trim(), notes:$('c-notes').value.trim() };
      if (!c.name || !c.phone || !c.address){ toast(t('fillAll')); return; }
      sendWhatsApp(c);
    };

    if ($('pin-go')){
      const go = async () => {
        const h = await sha256($('pin-in').value);
        if (h === CONFIG.adminPinHash){ S.admin=true; S.modal=null; render(); toast('🛠️'); }
        else $('pin-err').textContent = t('wrongPin');
      };
      $('pin-go').onclick = go;
      $('pin-in').onkeydown = e => { if (e.key==='Enter') go(); };
      setTimeout(() => { const p=$('pin-in'); if(p) p.focus(); }, 50);
    }
    if ($('gen-go')) $('gen-go').onclick = async () => {
      const v = $('gen-pin').value.trim();
      if (!v) return;
      $('gen-out').value = 'adminPinHash: "' + await sha256(v) + '",';
      $('gen-out').select();
    };

    if ($('st-save')) $('st-save').onclick = async () => {
      S.ghToken = $('st-token').value.trim();
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      S.modal=null; render(); toast(t('saved'));
    };
    if ($('st-push')) $('st-push').onclick = async () => {
      S.ghToken = $('st-token').value.trim() || S.ghToken;
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      const r = await pushRepoMenu();
      toast(r.ok ? t('pushed') : (r.reason==='no_token' ? t('noToken') : t('pushFail')));
    };
  }

  boot();
})();
</script>
