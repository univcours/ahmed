<style>
  @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Rubik:wght@400;500;700&display=swap');
  :root{
    --bg:#FAF6EF; --card:#FFFFFF; --ink:#221F1C; --ink-2:#6E675F; --ink-3:#A39A8F;
    --green:#B3202C; --green-2:#8F1822; --gold:#E0A63C; --gold-soft:#FBF0DC;
    --line:#EBE3D6; --red:#B3202C; --red-soft:#FBE7E4; --wa:#25D366; --ok:#1B7A4E;
    --sh-sm:0 1px 3px rgba(35,25,15,.08); --sh-md:0 8px 24px rgba(35,25,15,.12);
    --sh-lg:0 18px 50px rgba(35,25,15,.20);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  #app-root{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.6}
  h1,h2,h3{font-family:'Alexandria',sans-serif;font-weight:700;margin:0}
  img{display:block} button{font-family:'Rubik',sans-serif;cursor:pointer}

  /* ---------- زر الحفظ العائم للمدير ---------- */
  .save-fab{position:fixed;bottom:86px;inset-inline-end:16px;z-index:60;
    background:var(--red);color:#fff;border:none;border-radius:999px;
    padding:14px 22px;font-size:14px;font-weight:800;font-family:'Alexandria',sans-serif;
    box-shadow:0 8px 26px rgba(179,32,44,.5);cursor:pointer;
    animation:fab-pulse 1.6s ease infinite}
  @keyframes fab-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .save-fab:active{transform:scale(.95)}

  /* ---------- شريط الاتصال ---------- */
  .callbar{background:var(--gold);text-align:center;padding:8px 12px;font-size:13px;font-weight:700}
  .callbar a{color:#221F1C;text-decoration:none;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
  .callbar b{font-family:'Alexandria',sans-serif;font-size:14px;letter-spacing:.5px}
  @media(max-width:640px){.callbar{font-size:12px;padding:7px 10px}.callbar b{font-size:13px}}

  /* ---------- الشريط العلوي ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:#171310;color:#fff;box-shadow:var(--sh-md)}
  .topbar-in{max-width:1140px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:8px}
  .homebtn{width:40px;height:40px;flex-shrink:0;border:none;border-radius:12px;background:rgba(255,255,255,.12);
    color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
  .homebtn:hover{background:rgba(255,255,255,.22)}
  .brand{font-family:'Alexandria',sans-serif;font-weight:800;font-size:18px;display:flex;align-items:center;gap:7px;
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .brand .dot{width:9px;height:9px;background:var(--gold);border-radius:3px;transform:rotate(45deg);flex-shrink:0}
  .top-actions{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
  .iconbtn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:500;white-space:nowrap}
  .iconbtn:hover{background:rgba(255,255,255,.22)}
  .langbtn{background:transparent;color:#F5DFAE;border:1.5px solid rgba(255,255,255,.35);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700}
  .btn.red{background:transparent;color:var(--red);border:1.5px solid var(--red)}
  .btn.red:hover{background:var(--red-soft)}
  .cartbtn{position:relative;background:var(--gold);color:var(--ink);border:none;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700;white-space:nowrap}
  .badge{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);color:#fff;font-size:11px;font-weight:700;
    min-width:19px;height:19px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #171310}

  /* ---------- الهيرو ---------- */
  .hero{background:linear-gradient(165deg,rgba(16,9,5,.93) 0%,rgba(30,16,8,.87) 55%,rgba(78,38,14,.76) 100%),
    url('https://raw.githubusercontent.com/univcours/ahmed/main/WhatsApp%20Image%202026-08-28%20at%2012.17.46.jpeg') center 35%/cover no-repeat;
    color:#fff;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;opacity:.10;
    background-image:radial-gradient(circle at 3px 3px,#fff 2px,transparent 0);background-size:34px 34px;
    animation:bubbles 18s linear infinite}
  @keyframes bubbles{from{background-position:0 0}to{background-position:0 -680px}}
  @media (prefers-reduced-motion:reduce){.hero::before{animation:none}}
  .hero .wave{position:absolute;bottom:-1px;left:0;width:100%;height:60px;display:block}
  .hero-in{max-width:1140px;margin:0 auto;padding:32px 16px 84px;position:relative;text-align:center}
  .hero .tag{display:inline-flex;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:6px 14px;font-size:12px;color:#F5DFAE}
  .hero h1{font-size:clamp(28px,6vw,52px);font-weight:800;margin:12px 0 6px;color:#fff}
  .hero p{color:#EBDCC6;max-width:520px;margin:0 auto;font-size:15px}
  .gold-line{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:16px auto 0}
  .hero-cta{display:inline-block;margin-top:20px;background:var(--gold);color:#221F1C;
    font-weight:700;font-family:'Alexandria',sans-serif;font-size:15px;padding:13px 36px;
    border-radius:999px;text-decoration:none;box-shadow:0 6px 22px rgba(224,166,60,.45);
    transition:transform .15s, box-shadow .15s}
  .hero-cta:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(224,166,60,.55)}
  .hero-cta:active{transform:scale(.97)}

  /* ---------- قسم الشيف ---------- */
  .chef{max-width:1140px;margin:-54px auto 0;padding:0 16px;position:relative;z-index:5}
  .chef-card{background:var(--card);border-radius:22px;box-shadow:var(--sh-lg);padding:18px;
    display:flex;gap:18px;align-items:center;flex-wrap:wrap;direction:ltr}
  [dir="rtl"] .chef-card .chef-txt{direction:rtl;text-align:right}
  .chef-card img{width:185px;height:185px;object-fit:cover;object-position:center 10%;
    border-radius:50%;border:5px solid var(--gold);flex-shrink:0;cursor:zoom-in;
    margin-top:-85px;box-shadow:var(--sh-lg);background:var(--card)}
  .chef-txt{flex:1;min-width:220px}
  .chef-txt .role{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1px}
  .chef-txt h2{font-size:19px;margin:2px 0 5px}
  .chef-txt p{margin:0;color:var(--ink-2);font-size:14px}

  /* ---------- البحث والتصنيفات ---------- */
  .toolbar{max-width:1140px;margin:16px auto 0;padding:0 16px}
  .toolbar-card{background:var(--card);border-radius:18px;box-shadow:var(--sh-sm);padding:12px 14px;display:grid;gap:10px}
  .search{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:10px 14px}
  .search:focus-within{border-color:var(--gold)}
  .search input{border:none;background:transparent;outline:none;flex:1;font-family:'Rubik',sans-serif;font-size:16px;color:var(--ink);min-width:0}
  .cats{overflow:hidden;padding-bottom:2px;position:relative}
  .cats-track{display:flex;gap:8px;width:max-content;animation:cats-loop 34s linear infinite}
  .cats:hover .cats-track,.cats.paused .cats-track{animation-play-state:paused}
  @keyframes cats-loop{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  [dir="rtl"] .cats-track{animation-name:cats-loop-rtl}
  @keyframes cats-loop-rtl{from{transform:translateX(0)}to{transform:translateX(50%)}}
  @media (prefers-reduced-motion:reduce){.cats-track{animation:none}}
  .chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);white-space:nowrap;
    padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;flex:0 0 auto}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}

  /* ---------- أزرار المشاركة ---------- */
  .share-row{display:flex;gap:8px;margin-top:9px;align-items:center}
  .share-row span{font-size:11px;color:var(--ink-3)}
  .shr{width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:transform .15s;padding:0}
  .shr:hover{transform:scale(1.12)}
  .shr svg{width:16px;height:16px;fill:#fff}
  .shr.fb{background:#1877F2}
  .shr.wa2{background:#25D366}

  /* ---------- الشبكة (متجاوبة) ---------- */
  .grid{max-width:1140px;margin:0 auto;padding:22px 16px 130px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .dish{background:var(--card);border-radius:20px;box-shadow:var(--sh-sm);overflow:hidden;
    display:flex;flex-direction:column;transition:transform .22s, box-shadow .22s;animation:up .4s ease both}
  .dish:hover{transform:translateY(-4px);box-shadow:var(--sh-md)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.dish{animation:none;transition:none}}
  .dish-img{position:relative;aspect-ratio:4/3;background:#EDE7D8;cursor:zoom-in;overflow:hidden}
  .dish-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
  .dish:hover .dish-img img{transform:scale(1.05)}
  .zoom-hint{position:absolute;top:10px;inset-inline-start:10px;background:rgba(20,50,46,.7);color:#fff;pointer-events:none;
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;backdrop-filter:blur(4px)}
  .price-tag{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(255,255,255,.92);color:var(--green);
    font-weight:700;font-family:'Alexandria',sans-serif;font-size:11px;border-radius:8px;padding:2px 8px;box-shadow:var(--sh-sm);backdrop-filter:blur(3px);
    z-index:5;cursor:default;user-select:none}
  .price-tag s{opacity:.5;font-weight:500;margin-inline-end:2px}
  .price-tag .off{color:var(--red);font-size:9px;vertical-align:1px;letter-spacing:.3px}
  .hid-tag{position:absolute;top:10px;inset-inline-end:10px;background:var(--red);color:#fff;
    font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
  .dish-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
  .dish-body h3{font-size:17px;line-height:1.35}
  .dish-body p{margin:0;color:var(--ink-2);font-size:13px;flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .addbtn{background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;width:100%;
    display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px}
  .addbtn:hover{background:var(--green-2)}
  .stepper{display:flex;align-items:center;justify-content:space-between;background:var(--gold-soft);
    border:1.5px solid var(--gold);border-radius:12px;padding:4px}
  .stepper b{font-family:'Alexandria',sans-serif;font-size:16px}
  .stepbtn{width:40px;height:40px;border:none;background:var(--card);border-radius:9px;font-size:19px;font-weight:700;color:var(--green);box-shadow:var(--sh-sm)}

  /* ---------- تجاوب الهاتف: عمودان مدمجان ---------- */
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 12px 120px}
    .dish{border-radius:16px}
    .dish-body{padding:10px 11px 12px;gap:5px}
    .dish-body h3{font-size:14px}
    .dish-body p{font-size:12px;-webkit-line-clamp:2}
    .addbtn{padding:10px;font-size:13px;min-height:40px}
    .price-tag{font-size:10px;padding:2px 7px;bottom:6px;inset-inline-start:6px}
    .zoom-hint{width:26px;height:26px;font-size:12px}
    .stepbtn{width:34px;height:34px;font-size:17px}
    .hero-in{padding:24px 14px 68px}
    .chef{padding:0 12px;margin-top:-46px}
    .chef-card{padding:14px;gap:12px}
    .chef-card img{width:135px;height:135px;margin-top:-58px;border-width:4px}
    .chef-txt h2{font-size:17px}
    .chef-txt p{font-size:13px}
    .toolbar{padding:0 12px}
    .brand{font-size:15px}
    .iconbtn{padding:8px 9px;font-size:12px}
    .cartbtn{padding:8px 10px;font-size:12px}
    .langbtn{padding:7px 8px;font-size:11px}
    .homebtn{width:36px;height:36px;font-size:16px}
    .notice{margin:12px 12px 0;font-size:13px}
  }
  @media (max-width:340px){ .grid{grid-template-columns:1fr} }

  /* ---------- عارض الصور ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(10,25,22,.94);z-index:70;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:16px;animation:dim .2s ease;cursor:zoom-out}
  .lightbox img{max-width:96vw;max-height:78vh;object-fit:contain;border-radius:14px;box-shadow:var(--sh-lg)}
  .lb-cap{color:#fff;margin-top:14px;text-align:center;font-family:'Alexandria',sans-serif;font-size:17px;font-weight:700;padding:0 10px}
  .lb-price{color:var(--gold);font-size:15px;margin-top:2px}
  .lb-x{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;border:none;border-radius:12px;
    background:rgba(255,255,255,.14);color:#fff;font-size:20px}

  /* ---------- أزرار وحقول ---------- */
  .btn{background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;min-height:44px}
  .btn:hover{background:var(--green-2)} .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.wa{background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
  .field{display:grid;gap:5px}
  .field label{font-size:13px;font-weight:500;color:var(--ink-2)}
  .input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-family:'Rubik',sans-serif;font-size:16px;background:var(--card);color:var(--ink)}
  .input:focus{outline:none;border-color:var(--gold)}
  textarea.input{resize:vertical}

  .notice{max-width:1104px;margin:16px auto 0;border-radius:14px;padding:12px 16px;font-size:14px;
    display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;text-align:center}
  .notice.err{background:var(--red-soft);color:var(--red);border:1px solid #EBC4BB}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;
    border-radius:999px;padding:11px 20px;font-size:13px;box-shadow:var(--sh-lg);animation:toast 2.4s ease both;pointer-events:none;
    max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
  .spinner{width:32px;height:32px;border:4px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- النوافذ ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,35,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:dim .2s ease}
  @keyframes dim{from{opacity:0}}
  .sheet{background:var(--card);width:100%;max-width:540px;max-height:92vh;overflow:auto;
    border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:rise .28s ease}
  @keyframes rise{from{transform:translateY(30px);opacity:0}}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px;padding:24px 22px}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .xbtn{width:38px;height:38px;border:none;background:var(--bg);border-radius:12px;font-size:16px;color:var(--ink-2);flex-shrink:0}
  .cart-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .cart-row img{width:52px;height:52px;object-fit:cover;border-radius:11px;flex-shrink:0}
  .total-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);
    border-radius:13px;padding:13px 15px;margin:13px 0;font-family:'Alexandria',sans-serif;font-weight:800;font-size:16px}
  .cod{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border:1px solid #EDD9A3;border-radius:12px;padding:10px 13px;font-size:13px;margin:10px 0 13px}
  .empty{grid-column:1/-1;text-align:center;padding:56px 18px;color:var(--ink-2)}
  .empty .big{font-size:48px;margin-bottom:8px}
  /* ---------- مشغّل الفيديو الكامل ---------- */
  .voverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;animation:dim .2s ease;cursor:zoom-out}
  .voverlay video{max-width:96vw;max-height:82vh;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5);cursor:default}
  .voverlay .vx{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;
    border:none;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
  .voverlay .vcap{color:#fff;margin-top:12px;font-size:15px;opacity:.7}
  /* شارة فيديو على البطاقة */
  .vid-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.32)}

(function () {

  const CAT_ICONS = {'بسطيلة':'🥟','مأكولات بحرية':'🦞','لحوم ومشوي':'🥩','دجاج محمر':'🍗','لحم بالبرقوق':'🍖','كسكس وسفة':'🍲',
    'سلطات':'🥗','خضار':'🥦','مقبلات':'🧆','حلويات مغربية':'🍯','عصائر':'🧃','أجواء المطبخ':'👨‍🍳'};
  const catIcon = k => CAT_ICONS[k] ? CAT_ICONS[k] + ' ' : '';

  /* ---------- نصوص الواجهة ---------- */
  const T = {
    slogan:['🎉 الطبخ لكل المناسبات · 🛵 توصيل · 💵 الدفع عند الاستلام','🎉 Catering for all occasions · 🛵 Delivery · 💵 Cash on delivery'],
    heroSub:['أعراس، عقيقة، حفلات ومناسبات — وأيضاً وجباتكم اليومية. اختر، اطلب عبر واتساب، ونوصلها إلى بابك.','Weddings, celebrations and events — plus your everyday meals. Choose, order on WhatsApp, delivered to your door.'],

    cartEmpty:['سلتك فارغة — أضف بعض الوجبات الشهية 😋','Your cart is empty — add some tasty dishes 😋'],
    total:['المجموع','Total'],

    notesPh:['مثال: بدون بصل','e.g. no onions'],
    cod:['الدفع نقداً عند الاستلام — لا حاجة لبطاقة بنكية.','Cash on delivery — no bank card needed.'],
    waOrder:['أرسل الطلب عبر واتساب','Send order on WhatsApp'],
    fillAll:['⚠️ املأ الاسم والهاتف والعنوان وعدد الأشخاص','⚠️ Please fill name, phone, address and number of persons'],
    admin:['👤 المدير','👤 Admin'], adminLogin:['👤 دخول المدير','👤 Admin login'],
    pin:['الرمز السري','PIN code'], login:['دخول','Log in'], wrongPin:['الرمز غير صحيح','Wrong PIN'],
    quickPinTitle:['🔑 تعديل السعر — أدخل الرمز السري','🔑 Edit price — enter PIN'],
    quickEditTitle:['💰 السعر الجديد','💰 New price'],
    quickSave:['💾 حفظ السعر في المستودع','💾 Save price to repo'],
    noHashMsg:['لم تُضبط بصمة الرمز السري بعد. ولّد بصمة بالأسفل ثم الصقها في CONFIG.adminPinHash داخل الملف.','No PIN hash is set yet. Generate one below then paste it into CONFIG.adminPinHash inside the file.'],
    genTitle:['🔑 توليد بصمة رمز سري','🔑 Generate a PIN hash'],
    genPh:['اكتب الرمز السري الذي تريده','Type the PIN you want'],
    genBtn:['ولّد البصمة','Generate hash'],
    genHint:['انسخ السطر الناتج وضعه مكان adminPinHash في أول الملف. البصمة لا يمكن عكسها لمعرفة الرمز.','Copy the resulting line and paste it as adminPinHash at the top of the file. The hash cannot be reversed.'],
    newPin:['🔑 تغيير الرمز السري','🔑 Change admin PIN'],
    newPinPh:['اكتب الرمز الجديد (اجعله طويلاً وصعباً)','Type the new PIN (make it long and hard)'],
    newPinHint:['تُحفظ بصمته المشفرة فقط في ملف pin.json بالمستودع — الرمز نفسه لا يُكتب في أي مكان.','Only its encrypted hash is saved in pin.json in the repo — the PIN itself is never written anywhere.'],
    changePin:['🔑 غيّر الرمز واحفظه في المستودع','🔑 Change PIN & save to repo'],
    pinChanged:['🔑 تم تغيير الرمز وحفظه في المستودع','🔑 PIN changed and saved to repo'],
    dashboard:['🛠️ لوحة التحكم','🛠️ Dashboard'],
    dashSub:['كل الصور تظهر هنا — حتى المخفية. اضغط ✏️ على أي وجبة لتعديل اسمها ووصفها وسعرها.','All photos appear here — even hidden ones. Press ✏️ on any dish to edit its name, description and price.'],
    statAll:['كل الصور','All photos'], statVisible:['ظاهرة للزوار','Visible'], statHidden:['مخفية','Hidden'], statPriced:['لها سعر','Priced'],
    logout:['خروج','Log out'], refresh:['🔄 تحديث الصور','🔄 Refresh'],
    save:['💾 حفظ','💾 Save'], saved:['💾 تم الحفظ','💾 Saved'], cancel:['إلغاء','Cancel'],
    hide:['إخفاء هذه الوجبة عن الزوار','Hide this dish from visitors'], hidden:['مخفية','Hidden'],
    del:['🗑️ مسح من الصفحة (لن تظهر للزوار)','🗑️ Remove from page (hidden from visitors)'],
    restore:['♻️ استرجاع الوجبة','♻️ Restore dish'],
    deleted:['🗑️ مُسحت — لن تظهر للزوار','🗑️ Removed — hidden from visitors'],
    restoredMsg:['♻️ رجعت تظهر للزوار','♻️ Visible to visitors again'],
    nameAr:['اسم الوجبة (عربي)','Dish name (Arabic)'], nameEn:['اسم الوجبة (إنجليزي)','Dish name (English)'],
    descAr:['الوصف (عربي)','Description (Arabic)'], descEn:['الوصف (إنجليزي)','Description (English)'],
    price:['السعر','Price'], category:['التصنيف (اختياري)','Category (optional)'],
    oldPrice:['السعر قبل التخفيض (اختياري — يظهر مشطوباً)','Old price (optional — shown crossed out)'],
    saleChk:['إظهار شارة «مخفض» على الوجبة','Show a "SALE" badge on the dish'],
    saleTag:['مخفض','SALE'],
    waNumbers:['أرقام واتساب لاستقبال الطلبات (رقم في كل سطر — الأول هو الرئيسي)','WhatsApp numbers receiving orders (one per line — first is primary)'],
    waHint:['بالصيغة الدولية بدون + مثل 212612345678. الطلب يُفتح على الرقم الأول، وتظهر للزبون أزرار لإرسال نسخة للأرقام الأخرى.','International format without +, e.g. 212612345678. The order opens on the first number; buttons let the customer send a copy to the others.'],
    waExtraTitle:['📩 أرسل نسخة من الطلب','📩 Send a copy of the order'],
    waExtraSub:['تم فتح الطلب على الرقم الرئيسي. اضغط على كل رقم لإرسال نفس الطلب إليه أيضاً.','The order opened on the main number. Tap each number to also send it there.'],
    sendTo:['أرسل إلى','Send to'],
    noResults:['لا نتائج مطابقة','No matching results'],
    tryOther:['جرّب كلمة أخرى.','Try another word.'],
    noDishes:['لا توجد وجبات بعد','No dishes yet'],
    addToRepo:['أضف صور وجباتك إلى المستودع وستظهر هنا تلقائياً.','Add your dish photos to the repo and they will appear here automatically.'],
    footer:['💵 الدفع نقداً عند الاستلام · الصور تُحدَّث تلقائياً من المستودع','💵 Cash on delivery · Photos update automatically from the repo'],
    noRepo:['⚙️ لم يُكتشف المستودع — ارفع هذه الصفحة داخل مستودعك وفعّل GitHub Pages، أو ضع الرابط في CONFIG.repoUrl.','⚙️ No repo detected — host this page inside your repo with GitHub Pages, or set CONFIG.repoUrl.'],
    stToken:['رمز GitHub للحفظ في المستودع','GitHub token to save into the repo'],
    stTokenHint:['GitHub → Settings → Developer settings → Fine-grained tokens، صلاحية Contents: Read and write على هذا المستودع فقط. يُحفظ عندك أنت فقط.','GitHub → Settings → Developer settings → Fine-grained tokens, Contents: Read and write on this repo only. Stored only on your side.'],
    settings:['⚙️ الإعدادات والحفظ','⚙️ Settings & saving'],
    pushRepo:['⬆️ احفظ القائمة في المستودع','⬆️ Save menu to repo'],
    pushed:['✅ تم الحفظ في المستودع','✅ Saved to repo'],
    pushFail:['⚠️ تعذر الحفظ — تحقق من الرمز وصلاحياته','⚠️ Save failed — check token & permissions'],
    noToken:['⚠️ أضف رمز GitHub في لوحة التحكم ليُحفظ التعديل في المستودع','⚠️ Add a GitHub token in the dashboard to save to the repo'],
    synced:['✓ محفوظ في المستودع','✓ Synced to repo'],
    notSynced:['⚠ تغييرات غير محفوظة في المستودع','⚠ Unsaved repo changes'],
    orderMsgTitle:['🛒 طلب جديد من','🛒 New order from'],
    customer:['الزبون','Customer'], codShort:['الدفع عند الاستلام','cash on delivery'],
    thanks:['شكراً! سنؤكد طلبك على واتساب.','Thank you! We will confirm your order on WhatsApp.'],
    dirham:[CONFIG.currency, CONFIG.currencyEn],
  };
  const t = k => T[k][S.lang==='ar'?0:1];

  /* ---------- الحالة ---------- */
  const S = {
    lang:'ar', cfg:null, view:'home',       // home | admin
    data:{ items:{} },
    files:[], chefImgs:[], error:'', loadingList:true,
    cat:'الكل', q:'', cart:{}, admin:false, editing:null, modal:null, lightbox:null,
    dirty:false, saving:false, ghToken:'', pinHash:'',
  };

  /* ---------- تخزين آمن (يعمل حتى بدون window.storage) ---------- */
  const mem = {};
  async function sGet(k, shared=true){
    try{ if (window.storage){ const r = await window.storage.get(k, shared); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = localStorage.getItem('mk_'+k); if (v!==null) return JSON.parse(v); }catch(e){}
    return mem[k] ?? null;
  }
  async function sSet(k, v, shared=true){
    mem[k] = v;
    try{ localStorage.setItem('mk_'+k, JSON.stringify(v)); }catch(e){}
    try{ if (window.storage) await window.storage.set(k, JSON.stringify(v), shared); }catch(e){}
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function sha256(s){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2500); }
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\n/g,''))));

  const baseName = p => String(p).split('/').pop();
  function prettyName(file){
    let n = baseName(file).replace(IMG_EXT,'').replace(/[-_]+/g,' ').replace(/\s+\d+$/,'').trim();
    // أسماء عامة (WhatsApp Image…، IMG_1234…) لا تصلح كاسم وجبة — نعرض اسماً محايداً حتى يعدّله المدير
    if (!n || /whatsapp|^img\b|^image\b|^photo\b|^screenshot|^\d[\d\s.()-]*$/i.test(n))
      return S.lang==='ar' ? 'وجبة شهية' : 'Delicious dish';
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  const itemOf = f => S.data.items[f.name] || {};
  const iname = f => { const it=itemOf(f); return (S.lang==='ar' ? (it.name_ar||it.name_en) : (it.name_en||it.name_ar)) || prettyName(f.name); };
  const idesc = f => { const it=itemOf(f); return (S.lang==='ar' ? (it.desc_ar||'') : (it.desc_en||'')); };
  const iprice = f => Number(itemOf(f).price) || 0;   // الثمن الحقيقي — 0 يظهر حتى يضبطه المدير
  const iold = f => Number(itemOf(f).old_price) || 0;
  const isale = f => itemOf(f).sale !== false;   // شارة «مخفض» مفعّلة افتراضياً

  /* أرقام الواتساب: من إعدادات المستودع (menu.json) أولاً، ثم CONFIG */
  const waNums = () => {
    const arr = (S.data.settings && Array.isArray(S.data.settings.whatsapp) ? S.data.settings.whatsapp : [])
      .map(n => String(n).replace(/[^\d]/g,'')).filter(Boolean);
    if (arr.length) return arr;
    const c = String(CONFIG.whatsapp||'').replace(/[^\d]/g,'');
    return c ? [c] : [];
  };
  const waLink = (num, msg) => 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);

  function parseRepoUrl(url){
    try{
      let u = url.trim().replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\/+$/,'');
      const p = u.split('/').filter(Boolean);
      if (p.length < 2) return null;
      const owner=p[0], repo=p[1]; let branch='main', path='';
      if (p[2]==='tree' && p.length>3){ branch=p[3]; path=p.slice(4).join('/'); }
      else if (p.length>2 && p[2]!=='tree'){ path=p.slice(2).join('/'); }
      return {owner, repo, branch, path};
    }catch(e){ return null; }
  }
  const menuPath = () => (S.cfg.path ? S.cfg.path + '/' : '') + MENU_FILE;

  /* ---------- GitHub ---------- */
  async function repoDefaultBranch(owner, repo){
    try{
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
      if (r.ok){ const j = await r.json(); return j.default_branch || 'main'; }
    }catch(e){}
    return 'main';
  }

  async function detectRepo(){
    // 1) من CONFIG إن وُضع رابط
    if (CONFIG.repoUrl){
      const p = parseRepoUrl(CONFIG.repoUrl);
      if (p){
        if (!p.branch) p.branch = await repoDefaultBranch(p.owner, p.repo);
        return p;
      }
    }
    // 2) اكتشاف تلقائي: الصفحة مستضافة على GitHub Pages داخل المستودع نفسه
    try{
      const host = location.hostname;
      if (/\.github\.io$/i.test(host)){
        const owner = host.split('.')[0];
        const segs = location.pathname.split('/').filter(Boolean);
        const candidates = [];
        if (segs.length && !/\.html?$/i.test(segs[0])) candidates.push(segs[0]);
        candidates.push(owner + '.github.io');
        for (const repo of candidates){
          const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
          if (r.ok){ const j = await r.json(); return { owner, repo, branch:j.default_branch || 'main', path:'' }; }
        }
      }
    }catch(e){}
    // 3) إعداد محفوظ سابقاً
    return await sGet('config');
  }

  /* رابط raw مباشر — بلا حدود طلبات مثل API */
  const rawUrl = (path) => `https://raw.githubusercontent.com/${S.cfg.owner}/${S.cfg.repo}/${S.cfg.branch}/${path.split('/').map(encodeURIComponent).join('/')}`;

  async function listImages(cfg){
    const CACHE_KEY = 'imgs_cache_v1';
    const CACHE_MS  = 5 * 60 * 1000;   // كاش 5 دقائق
    // 1) كاش حديث؟ استعمله مباشرة (0 طلبات API)
    try{
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && Date.now() - c.t < CACHE_MS && Array.isArray(c.imgs) && c.imgs.length) return c.imgs;
    }catch(e){}
    // 2) طلب API واحد لجلب القائمة
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
    if (!res.ok){
      // 3) فشل (403 حد الطلبات؟) → آخر كاش محفوظ ولو قديم
      try{
        const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (c && Array.isArray(c.imgs) && c.imgs.length) return c.imgs;
      }catch(e){}
      throw new Error(S.lang==='ar'
        ? 'تعذر جلب الصور مؤقتاً (حد GitHub) — أعد المحاولة بعد دقائق'
        : 'Temporarily could not load photos (GitHub limit) — retry in a few minutes');
    }
    const j = await res.json();
    const inPath = p => !cfg.path || p === cfg.path || p.startsWith(cfg.path + '/');
    const imgs = (j.tree || [])
      .filter(n => n.type==='blob' && IMG_EXT.test(n.path) && inPath(n.path))
      .map(n => ({ name:n.path, url:`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${n.path.split('/').map(encodeURIComponent).join('/')}` }));
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), imgs})); }catch(e){}
    return imgs;
  }

  async function loadRepoMenu(){
    try{
      // raw مباشرة مع كسر الكاش — نقرأ دائماً أحدث نسخة من المستودع
      const res = await fetch(rawUrl(menuPath()) + '?v=' + Date.now());
      if (!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  /* الرمز السري: بصمته المشفرة فقط تُحفظ في ملف pin.json داخل المستودع */
  const pinPath = () => (S.cfg.path ? S.cfg.path + '/' : '') + 'pin.json';
  async function loadRepoPin(){
    try{
      const res = await fetch(rawUrl(pinPath()) + '?v=' + Date.now());
      if (!res.ok) return null;
      const j = await res.json();
      return j.pinHash || null;
    }catch(e){ return null; }
  }
  async function pushRepoPin(newHash){
    const token = S.ghToken || await sGet('gh_token', false);
    if (!token) return {ok:false, reason:'no_token'};
    try{
      const head = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${pinPath()}?ref=${S.cfg.branch}`,
        { headers:{ Authorization:'Bearer '+token } });
      let sha = null;
      if (head.ok) sha = (await head.json()).sha;
      const body = { message:'Update admin PIN (hashed)', branch:S.cfg.branch, content:b64enc(JSON.stringify({pinHash:newHash},null,2)) };
      if (sha) body.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${pinPath()}`,
        { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      return {ok:res.ok};
    }catch(e){ return {ok:false}; }
  }

  async function pushRepoMenu(){
    const token = S.ghToken || await sGet('gh_token', false);
    if (!token) return {ok:false, reason:'no_token'};
    S.saving = true; render();
    try{
      const head = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`,
        { headers:{ Authorization:'Bearer '+token } });
      let sha = null;
      if (head.ok) sha = (await head.json()).sha;
      const body = { message:'Update menu from website', branch:S.cfg.branch, content:b64enc(JSON.stringify(S.data,null,2)) };
      if (sha) body.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}`,
        { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      S.saving = false;
      if (!res.ok){ render(); return {ok:false}; }
      S.dirty = false; render();
      return {ok:true};
    }catch(e){ S.saving=false; render(); return {ok:false}; }
  }

  async function persist(){
    // الحفظ في المستودع فقط — لا حفظ محلي
    S.dirty = true;
    const r = await pushRepoMenu();
    if (r.ok){ S.dirty = false; toast(t('pushed')); }
    else if (r.reason==='no_token') toast('🚫 ' + (S.lang==='ar'
      ? 'لن يُحفظ التغيير! أضف رمز GitHub في الإعدادات أولاً'
      : 'Change NOT saved! Add a GitHub token in settings first'));
    else toast(t('pushFail'));
    render();
  }

  /* ---------- التشغيل ---------- */
  async function boot(){
    S.lang = (await sGet('lang', false)) || 'ar';
    S.ghToken = (await sGet('gh_token', false)) || '';
    S.cfg = await detectRepo();
    render();
    if (!S.cfg){ S.loadingList = false; render(); return; }
    S.pinHash = (await loadRepoPin()) || CONFIG.adminPinHash || '';
    // المصدر الوحيد للبيانات: menu.json في المستودع
    S.data = (await loadRepoMenu()) || { items:{} };
    if (!S.data.items) S.data.items = {};
    await refresh();
  }

  async function refresh(){
    S.error=''; S.loadingList = true; render();
    let imgs = [];
    try{ imgs = await listImages(S.cfg); }
    catch(e){
      const alt = S.cfg.branch==='main' ? 'master' : 'main';
      try{ S.cfg.branch = alt; imgs = await listImages(S.cfg); }
      catch(e2){ S.error = e.message; S.loadingList=false; render(); return; }
    }
    S.chefImgs = imgs.filter(f => CHEF_RE.test(baseName(f.name)));
    S.files = imgs.filter(f => !CHEF_RE.test(baseName(f.name)));
    S.loadingList = false;
    render();
  }

  const cartCount = () => Object.values(S.cart).reduce((a,b)=>a+b,0);
  const cartTotal = () => Object.entries(S.cart).reduce((a,[k,q])=>{
    const f = S.files.find(x=>x.name===k); return a + (f?iprice(f):0)*q;
  },0);
  const fileOf = k => S.files.find(f => f.name===k);

  function goHome(){
    S.view='home'; S.q=''; S.cat='الكل'; S.editing=null; S.modal=null; S.lightbox=null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ---------- طلب واتساب ---------- */
  function sendWhatsApp(c){
    const nums = waNums();
    if (!nums.length){ toast('⚠️ ' + (S.lang==='ar'?'لم تُضبط أرقام الواتساب — أضفها من لوحة التحكم':'WhatsApp numbers not set — add them in the dashboard')); return; }
    const lines = Object.entries(S.cart).map(([k,q]) => {
      const f = fileOf(k);
      return `• ${f?iname(f):k} × ${q} = ${(f?iprice(f):0)*q} ${t('dirham')}`;
    });
    const msg = [
      `${t('orderMsgTitle')} ${S.lang==='ar'?CONFIG.restaurantName:CONFIG.restaurantNameEn}:`,
      ...lines,
      `${t('total')}: *${cartTotal()} ${t('dirham')}* (${t('codShort')})`,
      '',
      `${t('customer')}:`,
      `👤 ${c.name}`, `📞 ${c.phone}`, `📍 ${c.address}`,
      `👥 ${S.lang==='ar'?'عدد الأشخاص':'Persons'}: ${c.persons}`,
      c.notes ? `📝 ${c.notes}` : ''
    ].filter(Boolean).join('\n');
    window.open(waLink(nums[0], msg), '_blank');
    S.cart = {};
    S.modal = nums.length > 1 ? { type:'wa-extra', msg, nums:nums.slice(1) } : null;
    render(); toast('✅ ' + t('thanks'));
  }

  /* نبني قائمة مدمجة: نضع فيديو بعد كل 6 صور */
  function buildMixed(files){
    const result = [];
    let vi = 0;
    files.forEach((f, i) => {
      result.push({ type:'img', data:f });
      if ((i+1) % 6 === 0 && vi < VIDEOS.length){
        result.push({ type:'vid', data:VIDEOS[vi++] });
      }
    });
    while (vi < VIDEOS.length) result.push({ type:'vid', data:VIDEOS[vi++] });
    return result;
  }

    if (!f) return '';

    return `

  /* ---------- الأحداث ---------- */
  function bind(){
    const $ = id => document.getElementById(id);
    const all = (sel,fn) => ROOT.querySelectorAll(sel).forEach(fn);

    /* أزرار المشاركة */
    const dishSlug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

    /* نرسم المعلومات على الصورة + نوضّحها لتعويض ضغط واتساب */
    function composeShareImage(f, nm, price, dsc){
      return new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try{
            const W = img.naturalWidth, H = img.naturalHeight;
            const c = document.createElement('canvas');
            c.width = W; c.height = H;
            const x = c.getContext('2d');
            x.imageSmoothingEnabled = true;
            x.imageSmoothingQuality = 'high';
            x.drawImage(img, 0, 0);

            /* توضيح (unsharp): يعوّض التنعيم الذي سيسببه ضغط واتساب */
            try{
              const d = x.getImageData(0, 0, W, H);
              const s = d.data, out = new Uint8ClampedArray(s);
              const a = 0.15, ctr = 1 + 4*a;   // توضيح ناعم — القوي يضخّم ضجيج الضغط
              for (let y = 1; y < H-1; y++){
                let i = (y*W + 1) * 4;
                for (let xx = 1; xx < W-1; xx++, i += 4){
                  for (let ch = 0; ch < 3; ch++){
                    const p = i + ch;
                    out[p] = ctr*s[p] - a*(s[p-4] + s[p+4] + s[p - W*4] + s[p + W*4]);
                  }
                }
              }
              d.data.set(out);
              x.putImageData(d, 0, 0);
            }catch(e){ /* إن فشل التوضيح نكمل بالصورة كما هي */ }

            /* شريط المعلومات — أعلى قليلاً إذا كان هناك وصف */
            const hasDsc = !!(dsc && dsc.trim());
            const barH = Math.round(H * (hasDsc ? 0.24 : 0.17));
            const g = x.createLinearGradient(0, H - barH, 0, H);
            g.addColorStop(0, 'rgba(15,8,4,0)');
            g.addColorStop(.3, 'rgba(15,8,4,.80)');
            g.addColorStop(1, 'rgba(15,8,4,.95)');
            x.fillStyle = g; x.fillRect(0, H - barH, W, barH);
            x.direction = 'rtl'; x.textAlign = 'right';
            const pad = Math.round(W * .04);
            const maxW = W - pad * 2;

            /* اسم + ثمن */
            x.fillStyle = '#FFFFFF';
            x.font = 'bold ' + Math.round(W * .046) + 'px Arial, sans-serif';
            x.fillText(nm + '  •  ' + price + ' درهم', W - pad,
                       H - Math.round(barH * (hasDsc ? .62 : .44)));

            /* الوصف — سطر واحد يُقصّ بأناقة إن طال */
            if (hasDsc){
              x.fillStyle = 'rgba(255,255,255,.92)';
              x.font = Math.round(W * .032) + 'px Arial, sans-serif';
              let line = dsc.trim();
              while (line.length > 4 && x.measureText(line + '…').width > maxW){
                line = line.slice(0, -2);
              }
              if (line !== dsc.trim()) line += '…';
              x.fillText(line, W - pad, H - Math.round(barH * .36));
            }

            /* الهاتف + الموقع */
            x.fillStyle = '#F2B84B';
            x.font = 'bold ' + Math.round(W * .031) + 'px Arial, sans-serif';
            x.fillText('📞 +212 689-199142  •  univcours.github.io/ahmed', W - pad,
                       H - Math.round(barH * (hasDsc ? .08 : .12)));

            c.toBlob(b => resolve(b), 'image/jpeg', .95);
          }catch(e){ resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = f.url;
      });
    }

    all('[data-share]', b => b.onclick = async e => {
      e.stopPropagation();
      const f = fileOf(b.dataset.key);
      const nm = f ? iname(f) : '';
      const price = f ? iprice(f) : '';
      const dsc = f ? idesc(f) : '';
      const siteUrl = 'https://univcours.github.io/ahmed/';
      const shareUrl = f ? (siteUrl + 'share/' + dishSlug(f.name) + '.html?v=3') : siteUrl;
      const msg = '🍽️ ' + nm + ' - ' + price + ' ' + t('dirham') + '\n'
                + (dsc ? dsc + '\n' : '')
                + '👨‍🍳 ' + (S.lang==='ar' ? CONFIG.restaurantName : CONFIG.restaurantNameEn) + '\n'
                + siteUrl;

      /* الهاتف فقط: الزران يشاركان الصورة المركّبة عبر قائمة مشاركة الهاتف.
         الحاسوب: روابط عادية — نافذة مشاركة ويندوز/ماك مربكة وغير عملية */
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (f && isMobile && navigator.share && navigator.canShare && window.File){
        try{
          toast('⏳ ' + (S.lang==='ar' ? 'جارٍ تجهيز الصورة…' : 'Preparing…'));
          const blob = await composeShareImage(f, nm, price, dsc);
          if (blob && blob.size > 5000){
            const file = new File([blob], 'meal.jpg', { type: 'image/jpeg' });
            if (navigator.canShare({ files:[file] })){
              await navigator.share({ files:[file], text: msg });
              return;
            }
          }
        }catch(err){
          if (err && err.name === 'AbortError') return;
        }
      }
      /* احتياط (حاسوب/متصفح قديم) */
      if (b.dataset.share === 'fb'){
        /* صورة الوجبة المباشرة = معاينة مضمونة. النص (بالوصف) يُنسخ — الصقه بـ Ctrl+V */
        try{
          if (navigator.clipboard && navigator.clipboard.writeText){

          }

        window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(f ? f.url : siteUrl), '_blank');
      } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');

    /* بطاقات الفيديو */

    ['go-home','brand-home'].forEach(id => { if ($(id)) $(id).onclick = goHome; });
    if ($('go-dash')) $('go-dash').onclick = () => { S.view='admin'; render(); window.scrollTo(0,0); };

            name_en: $('pe-nen').value.trim(),
          });
        } else if (fld === 'cat'){
          S.data.items[k] = Object.assign({}, it, { category: $('pe-cat').value.trim() });
        } else {
          S.data.items[k] = Object.assign({}, it, { price: Number($('pe-in').value) || 0 });
        }
        S.modal = null;
        await persist();   // يُحفظ في menu.json بالمستودع — يظهر للزوار كافة
      };
      $('pe-save').onclick = peSave;
      const first = $('pe-in') || $('pe-nar') || $('pe-cat');
      ['pe-in','pe-nar','pe-nen'].forEach(id => { if ($(id)) $(id).onkeydown = e => { if (e.key==='Enter') peSave(); }; });
      setTimeout(() => { if (first){ first.focus(); if (first.select) first.select(); } }, 50);
    }

    all('[data-lb]', el => el.onclick = e => {
      if (e.target.closest('button')) return;   // لا تفتح المكبّر عند الضغط على زر داخل الصورة
      if (e.target.closest('[data-pclick]')) return;   // ولا عند الضغط على السعر
      S.lightbox = el.dataset.lb; render();
    });
    all('[data-lb-chef]', el => el.onclick = () => { S.lightbox='__chef__'; render(); });
    if ($('lb')){
      $('lb').onclick = () => { S.lightbox=null; render(); };
      document.onkeydown = e => { if (e.key==='Escape' && S.lightbox){ S.lightbox=null; render(); } };
    }

    all('[data-save]', b => b.onclick = async () => {
      const k = b.dataset.save;
      S.data.items[k] = {
        name_ar:$('ed-name-ar').value.trim(), name_en:$('ed-name-en').value.trim(),
        desc_ar:$('ed-desc-ar').value.trim(), desc_en:$('ed-desc-en').value.trim(),
        price:Number($('ed-price').value)||0,
        old_price:Number($('ed-oldprice').value)||0,
        sale:$('ed-sale').checked,
        category:$('ed-cat').value.trim(),
        hidden:$('ed-hidden').checked,
      };
      S.editing=null;
      await persist();
    });

    ['do-refresh2','retry'].forEach(id => { if ($(id)) $(id).onclick = () => {
      try{ localStorage.removeItem('imgs_cache_v1'); }catch(e){}
      refresh();
    }; });
    if ($('open-cart')) $('open-cart').onclick = () => { S.modal='cart'; render(); };
    if ($('open-login')) $('open-login').onclick = () => { S.modal='login'; render(); };
    if ($('logout')) $('logout').onclick = () => { S.admin=false; S.editing=null; S.view='home'; render(); };

    all('.overlay', ov => ov.onclick = e => { if (e.target===ov){ S.modal=null; render(); } });
    all('.sheet [data-close]', b => b.onclick = () => { S.modal=null; render(); });

    all('[data-inc-m]', b => b.onclick = () => { const k=b.getAttribute('data-inc-m'); S.cart[k]++; render(); });
    all('[data-dec-m]', b => b.onclick = () => { const k=b.getAttribute('data-dec-m'); S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });

    if ($('wa-order')) $('wa-order').onclick = function(){
      const c = { name:$('c-name').value.trim(), phone:$('c-phone').value.trim(),
                  address:$('c-addr').value.trim(), persons:$('c-persons').value.trim(),
                  notes:$('c-notes').value.trim() };
      if (!c.name || !c.phone || !c.address || !c.persons){ toast(t('fillAll')); return; }
      sendWhatsApp(c);
    };

    if ($('pin-go')){
      const go = async () => {
        const h = await sha256($('pin-in').value);
        if (h === S.pinHash){
          S.admin=true; S.modal=null; S.view='admin';   // مباشرة إلى لوحة التحكم بكل الصور
          render(); window.scrollTo(0,0);
        }
        else $('pin-err').textContent = t('wrongPin');
      };
      $('pin-go').onclick = go;
      $('pin-in').onkeydown = e => { if (e.key==='Enter') go(); };
      setTimeout(() => { const p=$('pin-in'); if(p) p.focus(); }, 50);
    }
    if ($('gen-go')) $('gen-go').onclick = async () => {
      const v = $('gen-pin').value.trim();
      if (!v) return;
      $('gen-out').value = 'adminPinHash: "' + await sha256(v) + '",';
      $('gen-out').select();
    };

    if ($('st-save')) $('st-save').onclick = async () => {
      S.ghToken = $('st-token').value.trim();
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      if ($('st-wa')){
        const nums = $('st-wa').value.split(/[\n,;،]+/).map(s => s.replace(/[^\d]/g,'')).filter(Boolean);
        if (!S.data.settings) S.data.settings = {};
        S.data.settings.whatsapp = nums;
        await persist();          // يحفظ الأرقام في menu.json داخل المستودع
      } else {
        toast(t('saved'));
      }
    };
    if ($('st-push')) $('st-push').onclick = async () => {
      S.ghToken = $('st-token').value.trim() || S.ghToken;
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      const r = await pushRepoMenu();
      toast(r.ok ? t('pushed') : (r.reason==='no_token' ? t('noToken') : t('pushFail')));
    };
    if ($('change-pin')) $('change-pin').onclick = async () => {
      const v = $('new-pin').value.trim();
      if (!v) return;
      S.ghToken = ($('st-token') ? $('st-token').value.trim() : '') || S.ghToken;
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      const h = await sha256(v);
      const r = await pushRepoPin(h);
      if (r.ok){ S.pinHash = h; $('new-pin').value=''; toast(t('pinChanged')); }
      else toast(r.reason==='no_token' ? t('noToken') : t('pushFail'));
    };
  }

  /* ---------- حماية الصور (ردع التحميل) ---------- */
  const protMsg = () => toast('🔒 ' + (S.lang==='ar' ? 'محمي من طرف المطور' : 'Protected by the developer'));
  document.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO' ||
        e.target.closest('.dish-img') || e.target.closest('.lightbox') ||
        e.target.closest('.voverlay') || e.target.closest('.chef-card')){
      e.preventDefault(); protMsg();
    }
  });
  document.addEventListener('dragstart', e => {
    if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO'){ e.preventDefault(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['s','u'].includes(e.key.toLowerCase())){
      e.preventDefault(); protMsg();
    }
  });

  /* ---------- إيقاف مؤقت لشريط الأصناف عند اللمس (يستأنف بعد 4 ثوانٍ) ---------- */
  let catsResume = null;
  ['pointerdown','touchstart'].forEach(ev =>
    document.addEventListener(ev, e => {
      const cats = e.target.closest && e.target.closest('.cats');
      if (!cats) return;
      cats.classList.add('paused');
      clearTimeout(catsResume);
      catsResume = setTimeout(() => cats.classList.remove('paused'), 4000);
    }, {passive:true}));

  boot();
})();
</script>
</body>
</html>
