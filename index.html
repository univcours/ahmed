<style>

  .topbar-in{max-width:1140px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:8px}

  .homebtn:hover{background:rgba(255,255,255,.22)}
  .brand{font-family:'Alexandria',sans-serif;font-weight:800;font-size:18px;display:flex;align-items:center;gap:7px;

  .iconbtn:hover{background:rgba(255,255,255,.22)}
  .langbtn{background:transparent;color:#CFF3FB;border:1.5px solid rgba(255,255,255,.35);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700}

    animation:bubbles 18s linear infinite}

  .stepbtn{width:40px;height:40px;border:none;background:var(--card);border-radius:9px;font-size:19px;font-weight:700;color:var(--green);box-shadow:var(--sh-sm)}

    .dish-body h3{font-size:14px}
    .dish-body p{font-size:12px;-webkit-line-clamp:2}
    .addbtn{padding:10px;font-size:13px;min-height:40px}
    .price-tag{font-size:13px;padding:3px 9px}
    .zoom-hint{width:26px;height:26px;font-size:12px}
    .stepbtn{width:34px;height:34px;font-size:17px}
    .hero-in{padding:24px 14px 68px}
    .chef{padding:0 12px;margin-top:-46px}
    .chef-card{padding:14px;gap:12px}
    .chef-card img{width:80px;height:80px}

    .chef-txt p{font-size:13px}
    .toolbar{padding:0 12px}

    .notice{margin:12px 12px 0;font-size:13px}

  .lightbox{position:fixed;inset:0;background:rgba(10,25,22,.94);z-index:70;display:flex;flex-direction:column;

  .lb-cap{color:#fff;margin-top:14px;text-align:center;font-family:'Alexandria',sans-serif;font-size:17px;font-weight:700;padding:0 10px}

  .overlay{position:fixed;inset:0;background:rgba(15,35,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:dim .2s ease}

  .cod{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border:1px solid #EDD9A3;border-radius:12px;padding:10px 13px;font-size:13px;margin:10px 0 13px}

  .foot{max-width:1140px;margin:0 auto;padding:0 16px 36px;text-align:center;color:var(--ink-3);font-size:12px}

  /* ---------- لوحة التحكم ---------- */
  .dash{max-width:1140px;margin:0 auto;padding:20px 16px 130px}
  .dash-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:16px;box-shadow:var(--sh-sm);padding:14px;text-align:center}
  .stat b{display:block;font-family:'Alexandria',sans-serif;font-size:24px;color:var(--green)}
  .stat span{font-size:12px;color:var(--ink-2)}
  .panel{background:var(--card);border-radius:18px;box-shadow:var(--sh-sm);padding:16px;margin-bottom:16px;display:grid;gap:12px}

  .sync-pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px;display:inline-flex;align-items:center;gap:5px}
  .sync-pill.ok{background:#E3F2E9;color:var(--ok)}
  .sync-pill.warn{background:var(--gold-soft);color:#8A6410}
</style>

    noRepo:['⚙️ لم يُكتشف المستودع — ارفع هذه الصفحة داخل مستودعك وفعّل GitHub Pages، أو ضع الرابط في CONFIG.repoUrl.','⚙️ No repo detected — host this page inside your repo with GitHub Pages, or set CONFIG.repoUrl.'],
    stToken:['رمز GitHub للحفظ في المستودع','GitHub token to save into the repo'],

    settings:['⚙️ الإعدادات والحفظ','⚙️ Settings & saving'],

    pushFail:['⚠️ تعذر الحفظ — تحقق من الرمز وصلاحياته','⚠️ Save failed — check token & permissions'],
    noToken:['⚠️ أضف رمز GitHub في لوحة التحكم ليُحفظ التعديل في المستودع','⚠️ Add a GitHub token in the dashboard to save to the repo'],
    synced:['✓ محفوظ في المستودع','✓ Synced to repo'],
    notSynced:['⚠ تغييرات غير محفوظة في المستودع','⚠ Unsaved repo changes'],
    orderMsgTitle:['🛒 طلب جديد من','🛒 New order from'],
    customer:['الزبون','Customer'], codShort:['الدفع عند الاستلام','cash on delivery'],
    thanks:['شكراً! سنؤكد طلبك على واتساب.','Thank you! We will confirm your order on WhatsApp.'],
    dirham:[CONFIG.currency, CONFIG.currencyEn],
  };
  const t = k => T[k][S.lang==='ar'?0:1];

  /* ---------- الحالة ---------- */
  const S = {
    lang:'ar', cfg:null, view:'home',       // home | admin
    data:{ items:{} },
    files:[], chefImgs:[], error:'', loadingList:true,
    cat:'الكل', q:'', cart:{}, admin:false, editing:null, modal:null, lightbox:null,
    dirty:false, saving:false, ghToken:'',
  };

  /* ---------- تخزين آمن (يعمل حتى بدون window.storage) ---------- */
  const mem = {};
  async function sGet(k, shared=true){
    try{ if (window.storage){ const r = await window.storage.get(k, shared); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = localStorage.getItem('mk_'+k); if (v!==null) return JSON.parse(v); }catch(e){}
    return mem[k] ?? null;
  }
  async function sSet(k, v, shared=true){
    mem[k] = v;
    try{ localStorage.setItem('mk_'+k, JSON.stringify(v)); }catch(e){}
    try{ if (window.storage) await window.storage.set(k, JSON.stringify(v), shared); }catch(e){}
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function sha256(s){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2500); }
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\n/g,''))));

  const baseName = p => String(p).split('/').pop();
  function prettyName(file){
    let n = baseName(file).replace(IMG_EXT,'').replace(/[-_]+/g,' ').replace(/\s+\d+$/,'').trim();
    // أسماء عامة (WhatsApp Image…، IMG_1234…) لا تصلح كاسم وجبة — نعرض اسماً محايداً حتى يعدّله المدير
    if (!n || /whatsapp|^img\b|^image\b|^photo\b|^screenshot|^\d[\d\s.()-]*$/i.test(n))
      return S.lang==='ar' ? 'وجبة شهية' : 'Delicious dish';
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  const itemOf = f => S.data.items[f.name] || {};
  const iname = f => { const it=itemOf(f); return (S.lang==='ar' ? (it.name_ar||it.name_en) : (it.name_en||it.name_ar)) || prettyName(f.name); };
  const idesc = f => { const it=itemOf(f); return (S.lang==='ar' ? (it.desc_ar||'') : (it.desc_en||'')); };
  const iprice = f => Number(itemOf(f).price) || 0;

  function parseRepoUrl(url){
    try{
      let u = url.trim().replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\/+$/,'');
      const p = u.split('/').filter(Boolean);
      if (p.length < 2) return null;
      const owner=p[0], repo=p[1]; let branch='', path='';
      if (p[2]==='tree' && p.length>3){ branch=p[3]; path=p.slice(4).join('/'); }
      else if (p.length>2){ path=p.slice(2).join('/'); }
      return {owner,repo,branch,path};
    }catch(e){ return null; }
  }
  const menuPath = () => (S.cfg.path ? S.cfg.path + '/' : '') + MENU_FILE;

  /* ---------- GitHub ---------- */
  async function repoDefaultBranch(owner, repo){
    try{
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
      if (r.ok){ const j = await r.json(); return j.default_branch || 'main'; }
    }catch(e){}
    return 'main';
  }

  async function detectRepo(){
    // 1) من CONFIG إن وُضع رابط
    if (CONFIG.repoUrl){
      const p = parseRepoUrl(CONFIG.repoUrl);
      if (p){
        if (!p.branch) p.branch = await repoDefaultBranch(p.owner, p.repo);
        return p;
      }
    }
    // 2) اكتشاف تلقائي: الصفحة مستضافة على GitHub Pages داخل المستودع نفسه
    try{
      const host = location.hostname;
      if (/\.github\.io$/i.test(host)){
        const owner = host.split('.')[0];
        const segs = location.pathname.split('/').filter(Boolean);
        const candidates = [];
        if (segs.length && !/\.html?$/i.test(segs[0])) candidates.push(segs[0]);
        candidates.push(owner + '.github.io');
        for (const repo of candidates){
          const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
          if (r.ok){ const j = await r.json(); return { owner, repo, branch:j.default_branch || 'main', path:'' }; }
        }
      }
    }catch(e){}
    // 3) إعداد محفوظ سابقاً
    return await sGet('config');
  }

  async function listImages(cfg){
    // نمسح المستودع كاملاً دفعة واحدة ونلتقط كل الصور أينما كانت
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
    if (!res.ok) throw new Error(S.lang==='ar'
      ? 'تعذر جلب الصور — تأكد أن المستودع عام (Public)'
      : 'Could not load photos — check that the repo is Public');
    const j = await res.json();
    const inPath = p => !cfg.path || p === cfg.path || p.startsWith(cfg.path + '/');
    return (j.tree || [])
      .filter(n => n.type==='blob' && IMG_EXT.test(n.path) && inPath(n.path))
      .map(n => ({ name:n.path, url:`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${n.path.split('/').map(encodeURIComponent).join('/')}` }));
  }

  async function loadRepoMenu(){
    try{
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`);
      if (!res.ok) return null;
      const j = await res.json();
      return JSON.parse(b64dec(j.content));
    }catch(e){ return null; }
  }

  async function pushRepoMenu(){
    const token = S.ghToken || await sGet('gh_token', false);
    if (!token) return {ok:false, reason:'no_token'};
    S.saving = true; render();
    try{
      const head = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`,
        { headers:{ Authorization:'Bearer '+token } });
      let sha = null;
      if (head.ok) sha = (await head.json()).sha;
      const body = { message:'Update menu from website', branch:S.cfg.branch, content:b64enc(JSON.stringify(S.data,null,2)) };
      if (sha) body.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}`,
        { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      S.saving = false;
      if (!res.ok){ render(); return {ok:false}; }
      S.dirty = false; render();
      return {ok:true};
    }catch(e){ S.saving=false; render(); return {ok:false}; }
  }

  async function persist(){
    S.dirty = true;
    await sSet('data', S.data);
    const r = await pushRepoMenu();
    if (r.ok) toast(t('pushed'));
    else if (r.reason==='no_token') toast(t('noToken'));
    else toast(t('pushFail'));
    render();
  }

  /* ---------- التشغيل ---------- */
  async function boot(){
    S.lang = (await sGet('lang', false)) || 'ar';
    S.ghToken = (await sGet('gh_token', false)) || '';
    S.cfg = await detectRepo();
    render();
    if (!S.cfg){ S.loadingList = false; render(); return; }
    await sSet('config', S.cfg);
    const repoData = await loadRepoMenu();
    const backup = await sGet('data');
    S.data = repoData || backup || { items:{} };
    if (!S.data.items) S.data.items = {};
    await refresh();
  }

  async function refresh(){
    S.error=''; S.loadingList = true; render();
    let imgs = [];
    try{ imgs = await listImages(S.cfg); }
    catch(e){
      const alt = S.cfg.branch==='main' ? 'master' : 'main';
      try{ S.cfg.branch = alt; imgs = await listImages(S.cfg); }
      catch(e2){ S.error = e.message; S.loadingList=false; render(); return; }
    }
    S.chefImgs = imgs.filter(f => CHEF_RE.test(baseName(f.name)));
    S.files = imgs.filter(f => !CHEF_RE.test(baseName(f.name)));
    S.loadingList = false;
    render();
  }

  const cartCount = () => Object.values(S.cart).reduce((a,b)=>a+b,0);
  const cartTotal = () => Object.entries(S.cart).reduce((a,[k,q])=>{
    const f = S.files.find(x=>x.name===k); return a + (f?iprice(f):0)*q;
  },0);
  const fileOf = k => S.files.find(f => f.name===k);

  function goHome(){
    S.view='home'; S.q=''; S.cat='الكل'; S.editing=null; S.modal=null; S.lightbox=null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ---------- طلب واتساب ---------- */
  function sendWhatsApp(c){
    const num = String(CONFIG.whatsapp||'').replace(/[^\d]/g,'');
    if (!num){ toast('⚠️ ' + (S.lang==='ar'?'لم يُضبط رقم الواتساب في CONFIG':'WhatsApp number not set in CONFIG')); return; }
    const lines = Object.entries(S.cart).map(([k,q]) => {
      const f = fileOf(k);
      return `• ${f?iname(f):k} × ${q} = ${(f?iprice(f):0)*q} ${t('dirham')}`;
    });
    const msg = [
      `${t('orderMsgTitle')} ${S.lang==='ar'?CONFIG.restaurantName:CONFIG.restaurantNameEn}:`,
      ...lines,
      `${t('total')}: *${cartTotal()} ${t('dirham')}* (${t('codShort')})`,
      '',
      `${t('customer')}:`,
      `👤 ${c.name}`, `📞 ${c.phone}`, `📍 ${c.address}`,
      c.notes ? `📝 ${c.notes}` : ''
    ].filter(Boolean).join('\n');
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg), '_blank');
    S.cart = {}; S.modal = null; render(); toast('✅ ' + t('thanks'));
  }

  /* ---------- العرض ---------- */
  function render(){
    ROOT.dir = S.lang==='ar' ? 'rtl' : 'ltr';
    ROOT.lang = S.lang;
    document.documentElement.dir = ROOT.dir;
    const restName = S.lang==='ar' ? CONFIG.restaurantName : CONFIG.restaurantNameEn;

    ROOT.innerHTML = `
      ${topbarHTML(restName)}
      ${S.view==='admin' && S.admin ? adminHTML() : homeHTML(restName)}
      ${modalHTML()}
      ${lightboxHTML()}`;
    bind();
  }

  function topbarHTML(restName){
    return `
      <div class="topbar"><div class="topbar-in">
        <button class="homebtn" id="go-home" title="${t('home')}">🏠</button>
        <span class="brand" id="brand-home"><span class="dot"></span>${esc(restName)}</span>
        <div class="top-actions">
          <button class="langbtn" id="lang-toggle">${S.lang==='ar' ? 'EN' : 'عربية'}</button>
          ${!S.admin
            ? `<button class="iconbtn" id="open-login">${t('admin')}</button>`
            : (S.view==='admin'
                ? `<button class="iconbtn" id="logout">${t('logout')}</button>`
                : `<button class="iconbtn" id="go-dash">🛠️</button>
                   <button class="iconbtn" id="logout">${t('logout')}</button>`)}
          <button class="cartbtn" id="open-cart">🧺${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button>
        </div>
      </div></div>`;
  }

  /* --- الصفحة الرئيسية (الزوار) --- */
  function homeHTML(restName){
    const welcome = S.lang==='ar' ? CONFIG.welcomeAr : CONFIG.welcomeEn;
    const chef = S.chefImgs[0];
    const query = S.q.trim().toLowerCase();
    const match = f => {
      const it = itemOf(f);
      if (it.hidden) return false;
      if (S.cat!=='الكل' && it.category!==S.cat) return false;
      if (query){
        const hay = [iname(f), it.name_ar, it.name_en, it.desc_ar, it.desc_en].join(' ').toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    };
    const visible = S.files.filter(match);

    return `
      <div class="hero"><div class="hero-in">
        <span class="tag">${t('slogan')}</span>
        <h1>${esc(restName)}</h1>
        <p>${t('heroSub')}</p>
        <div class="gold-line"></div>
      </div>
      <svg class="wave" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,45 C180,75 360,5 620,32 C880,60 1100,8 1440,42 L1440,70 L0,70 Z" fill="#EAF6FA" opacity=".55"/>
        <path d="M0,52 C240,78 520,18 780,40 C1040,62 1240,22 1440,50 L1440,70 L0,70 Z" fill="#EAF6FA"/>
      </svg>
      </div>

      <div class="chef"><div class="chef-card">
        ${chef ? `<img src="${esc(chef.url)}" alt="Chef" data-lb-chef="1">` : `<div style="width:100px;height:100px;border-radius:50%;border:4px solid var(--gold);background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:40px;flex-shrink:0">👨‍🍳</div>`}
        <div class="chef-txt">
          <span class="role">${t('chefRole')}</span>
          <h2>${esc(restName)}</h2>
          <p>${esc(welcome)}</p>
        </div>
      </div></div>

      <div class="toolbar"><div class="toolbar-card">
        <div class="search"><span>🔍</span>
          <input id="search-in" placeholder="${t('search')}" value="${esc(S.q)}">
          ${query ? '<button class="xbtn" id="clear-q" style="width:30px;height:30px;font-size:13px">✕</button>' : ''}
        </div>
        <div class="cats">
          <button class="chip ${S.cat==='الكل'?'on':''}" data-cat="الكل">${t('all')}</button>
          ${CATS.map(c => `<button class="chip ${S.cat===c.k?'on':''}" data-cat="${esc(c.k)}">${esc(catLabel(c.k))}</button>`).join('')}
        </div>
      </div></div>

      ${!S.cfg ? `<div class="notice err">${t('noRepo')}</div>` : ''}
      ${S.error ? `<div class="notice err">⚠️ ${esc(S.error)} <button class="btn ghost" id="retry" style="padding:6px 14px;font-size:13px;min-height:0">🔄</button></div>` : ''}

      <main class="grid">
        ${S.loadingList ? `<div class="empty"><div class="spinner" style="margin:0 auto 14px"></div></div>` : ''}
        ${visible.map((f,i)=>dishHTML(f,i,false)).join('')}
        ${(!S.loadingList && !visible.length && !S.error && S.cfg) ? `
          <div class="empty">
            <div class="big">${(query||S.cat!=='الكل')?'🔍':'🍽️'}</div>
            <h3 style="margin-bottom:6px">${(query||S.cat!=='الكل')?t('noResults'):t('noDishes')}</h3>
            <p>${(query||S.cat!=='الكل')?t('tryOther'):t('addToRepo')}</p>
          </div>`:''}
      </main>

      <p class="foot">${t('footer')}</p>`;
  }

  /* --- لوحة التحكم (المدير) --- */
  function adminHTML(){
    const all = S.files.length;
    const hiddenN = S.files.filter(f => itemOf(f).hidden).length;
    const pricedN = S.files.filter(f => iprice(f) > 0).length;

    return `
      <div class="dash">
        <div class="dash-head">
          <div>
            <h1>${t('dashboard')}</h1>
            <p style="margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:560px">${t('dashSub')}</p>
          </div>
          <span class="sync-pill ${S.dirty?'warn':'ok'}">${S.saving?'⏳…':(S.dirty?t('notSynced'):t('synced'))}</span>
        </div>

        <div class="stats">
          <div class="stat"><b>${all}</b><span>${t('statAll')}</span></div>

          <div style="display:flex;gap:8px;flex-wrap:wrap">

            <button class="btn gold" id="st-push" style="flex:1;min-width:140px">${t('pushRepo')}</button>
            <button class="btn ghost" id="do-refresh2" style="flex:1;min-width:140px">${t('refresh')}</button>
          </div>
        </div>

        <div class="grid" style="padding:0 0 40px">
          ${S.loadingList ? `<div class="empty"><div class="spinner" style="margin:0 auto 14px"></div></div>` : ''}
          ${S.files.map((f,i)=>dishHTML(f,i,true)).join('')}
          ${(!S.loadingList && !S.files.length) ? `
            <div class="empty"><div class="big">🍽️</div>
              <h3 style="margin-bottom:6px">${t('noDishes')}</h3><p>${t('addToRepo')}</p></div>`:''}
        </div>
      </div>`;
  }

  /* --- بطاقة وجبة --- */
  function dishHTML(f,i,adminCard){
    const it = itemOf(f);
    const qty = S.cart[f.name] || 0;
    const editing = S.editing===f.name;
    const price = iprice(f);

    const action = editing ? `
      <div style="display:grid;gap:8px">
        <div class="field"><label>${t('nameAr')}</label><input class="input" id="ed-name-ar" value="${esc(it.name_ar||'')}" placeholder="${esc(prettyName(f.name))}"></div>
        <div class="field"><label>${t('nameEn')}</label><input class="input" id="ed-name-en" dir="ltr" style="text-align:left" value="${esc(it.name_en||'')}"></div>
        <div class="field"><label>${t('descAr')}</label><textarea class="input" id="ed-desc-ar" rows="2">${esc(it.desc_ar||'')}</textarea></div>
        <div class="field"><label>${t('descEn')}</label><textarea class="input" id="ed-desc-en" dir="ltr" style="text-align:left" rows="2">${esc(it.desc_en||'')}</textarea></div>
        <div class="field"><label>${t('price')} (${t('dirham')})</label><input class="input" id="ed-price" type="number" inputmode="numeric" value="${esc(it.price||'')}"></div>
        <div class="field"><label>${t('category')}</label>
          <select class="input" id="ed-cat">
            <option value="">${S.lang==='ar'?'— بدون تصنيف —':'— No category —'}</option>
            ${CATS.map(c=>`<option value="${esc(c.k)}" ${c.k===it.category?'selected':''}>${esc(catLabel(c.k))}</option>`).join('')}
          </select></div>
        <label style="font-size:14px;display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="ed-hidden" ${it.hidden?'checked':''}> ${t('hide')}</label>
        <div style="display:flex;gap:8px">
          <button class="btn" style="flex:1" data-save="${esc(f.name)}">${t('save')}</button>
          <button class="btn ghost" data-cancel="1">${t('cancel')}</button>
        </div>
      </div>`
    : adminCard ? `
      <div style="display:flex;gap:8px">
        <button class="btn gold" data-edit="${esc(f.name)}" style="flex:1">✏️ ${S.lang==='ar'?'تعديل':'Edit'}</button>
        <button class="btn ${it.hidden?'ghost':'red'}" data-del="${esc(f.name)}" style="padding:12px 14px" title="${it.hidden?t('restore'):t('del')}">${it.hidden?'♻️':'🗑️'}</button>
      </div>`
    : qty===0 ? `
      <button class="addbtn" data-add="${esc(f.name)}">${t('add')} <b>+</b></button>`
    : `
      <div class="stepper">
        <button class="stepbtn" data-dec="${esc(f.name)}">−</button><b>${qty}</b>
        <button class="stepbtn" data-inc="${esc(f.name)}">+</button>
      </div>`;

    return `
      <article class="dish" style="animation-delay:${Math.min(i*30,280)}ms;${it.hidden && adminCard?'outline:2px dashed var(--red);outline-offset:-2px':''}">
        <div class="dish-img" data-lb="${esc(f.name)}" title="${S.lang==='ar'?'اضغط للتكبير':'Click to zoom'}">
          <img src="${esc(f.url)}" alt="${esc(iname(f))}" loading="lazy">
          <span class="zoom-hint">⤢</span>
          ${price ? `<span class="price-tag">${price} ${t('dirham')}</span>` : ''}
          ${it.hidden && adminCard ? `<span class="hid-tag">${t('hidden')}</span>` : ''}
        </div>
        <div class="dish-body">
          <h3>${esc(iname(f))}</h3>
          ${it.category ? `<span style="font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.3px">${esc(catLabel(it.category))}</span>` : ''}
          ${idesc(f) ? `<p>${esc(idesc(f))}</p>` : (adminCard?'':'<p></p>')}
          ${action}
        </div>
      </article>`;
  }

  /* --- عارض الصور --- */
  function lightboxHTML(){
    if (!S.lightbox) return '';
    const f = S.lightbox==='__chef__' ? S.chefImgs[0] : fileOf(S.lightbox);
    if (!f) return '';
    const isChef = S.lightbox==='__chef__';
    const price = isChef ? 0 : iprice(f);
    return `
      <div class="lightbox" id="lb">
        <button class="lb-x" id="lb-x">✕</button>
        <img src="${esc(f.url)}" alt="">
        <div class="lb-cap">${esc(isChef ? t('chefRole') : iname(f))}</div>
        ${price ? `<div class="lb-price">${price} ${t('dirham')}</div>` : ''}
      </div>`;
  }

  /* --- النوافذ --- */
  function modalHTML(){
    if (!S.modal) return '';

    if (S.modal==='cart'){
      const entries = Object.entries(S.cart);
      const rows = entries.map(([k,q]) => {
        const f = fileOf(k);
        return `
        <div class="cart-row">
          ${f?`<img src="${esc(f.url)}" alt="">`:''}
          <div style="flex:1;min-width:0">
            <b style="display:block;font-size:14px">${esc(f?iname(f):k)}</b>
            <span style="color:var(--ink-2);font-size:12px">${f?iprice(f):0} × ${q} = <b>${(f?iprice(f):0)*q} ${t('dirham')}</b></span>
          </div>
          <div class="stepper" style="padding:3px">
            <button class="stepbtn" style="width:32px;height:32px;font-size:15px" data-dec-m="${esc(k)}">−</button>
            <b style="min-width:20px;text-align:center">${q}</b>
            <button class="stepbtn" style="width:32px;height:32px;font-size:15px" data-inc-m="${esc(k)}">+</button>
          </div>
        </div>`;
      }).join('');
      return `
      <div class="overlay" data-close="1"><div class="sheet">
        <div class="sheet-head"><h2>${t('cartTitle')}</h2><button class="xbtn" data-close="1">✕</button></div>
        ${entries.length ? rows : `<p style="text-align:center;color:var(--ink-2);padding:24px 0">${t('cartEmpty')}</p>`}
        ${entries.length ? `
          <div class="total-row"><span>${t('total')}</span><span style="color:var(--green)">${cartTotal()} ${t('dirham')}</span></div>
          <h3 style="font-size:15px;margin-bottom:10px">${t('delivery')}</h3>
          <div style="display:grid;gap:10px">
            <div class="field"><label>${t('name')}</label><input class="input" id="c-name" autocomplete="name"></div>
            <div class="field"><label>${t('phone')}</label><input class="input" id="c-phone" type="tel" inputmode="tel" dir="ltr" style="text-align:left" autocomplete="tel"></div>
            <div class="field"><label>${t('address')}</label><textarea class="input" id="c-addr" rows="2"></textarea></div>
            <div class="field"><label>${t('notes')}</label><input class="input" id="c-notes" placeholder="${t('notesPh')}"></div>
          </div>
          <div class="cod">💵 <span>${t('cod')}</span></div>
          <button class="btn wa" id="wa-order" style="width:100%;padding:14px;font-size:15px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4l-2.1-1c-.3-.1-.5-.1-.7.1l-1 1.2c-.2.2-.4.2-.6.1-1.6-.8-3-2.1-3.8-3.8-.1-.2-.1-.4.1-.6l1.2-1c.2-.2.2-.4.1-.7l-1-2.1c-.2-.4-.5-.5-.9-.4-1.2.4-2 1.6-1.8 2.8.5 3.9 3.6 7 7.5 7.5 1.2.2 2.4-.6 2.8-1.8.1-.4 0-.7-.4-.9zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5-1.3c1.5.8 3.2 1.3 5 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.3c-1.6 0-3.1-.5-4.4-1.2l-.3-.2-3 .8.8-3-.2-.3c-.8-1.3-1.2-2.9-1.2-4.4 0-4.6 3.7-8.3 8.3-8.3s8.3 3.7 8.3 8.3-3.7 8.3-8.3 8.3z"/></svg>
            ${t('waOrder')} — ${cartTotal()} ${t('dirham')}
          </button>` : ''}
      </div></div>`;
    }

    if (S.modal==='login'){
      const noHash = !CONFIG.adminPinHash;
      return `
      <div class="overlay" data-close="1"><div class="sheet" style="max-width:420px">
        <div class="sheet-head"><h2>${t('adminLogin')}</h2><button class="xbtn" data-close="1">✕</button></div>
        ${noHash
          ? `<p style="margin:0 0 6px;font-size:14px;color:var(--red);background:var(--red-soft);border-radius:12px;padding:10px 14px">${t('noHashMsg')}</p>`
          : `<div class="field"><label>${t('pin')}</label><input class="input" id="pin-in" type="password"></div>
             <p id="pin-err" style="color:var(--red);font-size:14px;margin:8px 0 0"></p>
             <button class="btn" id="pin-go" style="width:100%;margin-top:14px">${t('login')}</button>`}
        <details style="margin-top:14px" ${noHash?'open':''}>
          <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--green)">${t('genTitle')}</summary>
          <div style="display:grid;gap:8px;margin-top:10px">
            <input class="input" id="gen-pin" type="password" placeholder="${t('genPh')}">
            <button class="btn gold" id="gen-go">${t('genBtn')}</button>
            <textarea class="input" id="gen-out" rows="2" readonly dir="ltr" style="text-align:left;font-size:12px;font-family:monospace" onclick="this.select()"></textarea>
            <span style="font-size:12px;color:var(--ink-3)">${t('genHint')}</span>
          </div>
        </details>
      </div></div>`;
    }
    return '';
  }

  /* ---------- الأحداث ---------- */
  function bind(){
    const $ = id => document.getElementById(id);
    const all = (sel,fn) => ROOT.querySelectorAll(sel).forEach(fn);

    ['go-home','brand-home'].forEach(id => { if ($(id)) $(id).onclick = goHome; });
    if ($('go-dash')) $('go-dash').onclick = () => { S.view='admin'; render(); window.scrollTo(0,0); };

    if ($('lang-toggle')) $('lang-toggle').onclick = async () => {
      S.lang = S.lang==='ar' ? 'en' : 'ar';
      await sSet('lang', S.lang, false);
      render();
    };

    const si = $('search-in');
    if (si){
      let tm;
      si.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { S.q = si.value; render();
        const n=$('search-in'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} }, 300); };
    }
    if ($('clear-q')) $('clear-q').onclick = () => { S.q=''; render(); };

    all('[data-cat]', b => b.onclick = () => { S.cat=b.dataset.cat; render(); });
    all('[data-add]', b => b.onclick = () => { S.cart[b.dataset.add]=1; render(); toast(t('added')); });
    all('[data-inc]', b => b.onclick = () => { S.cart[b.dataset.inc]++; render(); });
    all('[data-dec]', b => b.onclick = () => { const k=b.dataset.dec; S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });
    all('[data-edit]', b => b.onclick = () => { S.editing=b.dataset.edit; render(); });
    all('[data-cancel]', b => b.onclick = () => { S.editing=null; render(); });
    all('[data-del]', b => b.onclick = async () => {
      const k = b.dataset.del;
      const it = S.data.items[k] || {};
      S.data.items[k] = Object.assign({}, it, { hidden: !it.hidden });
      toast(S.data.items[k].hidden ? t('deleted') : t('restoredMsg'));
      await persist();
    });

    /* تكبير الصور */
    all('[data-lb]', el => el.onclick = e => {
      if (e.target.closest('button')) return;   // لا تفتح المكبّر عند الضغط على زر داخل الصورة
      S.lightbox = el.dataset.lb; render();
    });
    all('[data-lb-chef]', el => el.onclick = () => { S.lightbox='__chef__'; render(); });
    if ($('lb')){
      $('lb').onclick = () => { S.lightbox=null; render(); };
      document.onkeydown = e => { if (e.key==='Escape' && S.lightbox){ S.lightbox=null; render(); } };
    }

    all('[data-save]', b => b.onclick = async () => {
      const k = b.dataset.save;
      S.data.items[k] = {
        name_ar:$('ed-name-ar').value.trim(), name_en:$('ed-name-en').value.trim(),
        desc_ar:$('ed-desc-ar').value.trim(), desc_en:$('ed-desc-en').value.trim(),
        price:Number($('ed-price').value)||0,
        category:$('ed-cat').value.trim(),
        hidden:$('ed-hidden').checked,
      };
      S.editing=null;
      await persist();
    });

    ['do-refresh2','retry'].forEach(id => { if ($(id)) $(id).onclick = refresh; });
    if ($('open-cart')) $('open-cart').onclick = () => { S.modal='cart'; render(); };
    if ($('open-login')) $('open-login').onclick = () => { S.modal='login'; render(); };
    if ($('logout')) $('logout').onclick = () => { S.admin=false; S.editing=null; S.view='home'; render(); };

    all('.overlay', ov => ov.onclick = e => { if (e.target===ov){ S.modal=null; render(); } });
    all('.sheet [data-close]', b => b.onclick = () => { S.modal=null; render(); });

    all('[data-inc-m]', b => b.onclick = () => { const k=b.getAttribute('data-inc-m'); S.cart[k]++; render(); });
    all('[data-dec-m]', b => b.onclick = () => { const k=b.getAttribute('data-dec-m'); S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });

    if ($('wa-order')) $('wa-order').onclick = function(){
      const c = { name:$('c-name').value.trim(), phone:$('c-phone').value.trim(),
                  address:$('c-addr').value.trim(), notes:$('c-notes').value.trim() };
      if (!c.name || !c.phone || !c.address){ toast(t('fillAll')); return; }
      sendWhatsApp(c);
    };

    if ($('pin-go')){
      const go = async () => {
        const h = await sha256($('pin-in').value);
        if (h === CONFIG.adminPinHash){
          S.admin=true; S.modal=null; S.view='admin';   // مباشرة إلى لوحة التحكم بكل الصور
          render(); window.scrollTo(0,0);
        }
        else $('pin-err').textContent = t('wrongPin');
      };
      $('pin-go').onclick = go;
      $('pin-in').onkeydown = e => { if (e.key==='Enter') go(); };
      setTimeout(() => { const p=$('pin-in'); if(p) p.focus(); }, 50);
    }
    if ($('gen-go')) $('gen-go').onclick = async () => {
      const v = $('gen-pin').value.trim();
      if (!v) return;
      $('gen-out').value = 'adminPinHash: "' + await sha256(v) + '",';
      $('gen-out').select();
    };

    if ($('st-save')) $('st-save').onclick = async () => {
      S.ghToken = $('st-token').value.trim();
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      toast(t('saved'));
    };
    if ($('st-push')) $('st-push').onclick = async () => {
      S.ghToken = $('st-token').value.trim() || S.ghToken;
      if (S.ghToken) await sSet('gh_token', S.ghToken, false);
      const r = await pushRepoMenu();
      toast(r.ok ? t('pushed') : (r.reason==='no_token' ? t('noToken') : t('pushFail')));
    };
  }

  boot();
})();
</script>
</body>
</html>
