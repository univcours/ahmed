<!-- مطبخنا — صفحة وجبات احترافية ثنائية اللغة | طلب عبر واتساب | حفظ في GitHub -->

  .badge{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);color:#fff;font-size:12px;font-weight:700;

  .hero{background:var(--green);color:#fff;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;opacity:.07;

  .hero-in{max-width:1140px;margin:0 auto;padding:38px 18px 90px;position:relative;text-align:center}
  .hero .tag{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);

  .hero p{color:#C8D6D0;max-width:520px;margin:0 auto;font-size:16px}
  .gold-line{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:18px auto 0}

  /* قسم الشيف */

  .chef-card{background:var(--card);border-radius:22px;box-shadow:var(--sh-lg);padding:20px;

  .chef-card img{width:110px;height:110px;object-fit:cover;border-radius:50%;border:4px solid var(--gold);flex-shrink:0}
  .chef-txt{flex:1;min-width:230px}
  .chef-txt .role{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:1px}
  .chef-txt h2{font-size:21px;margin:2px 0 6px}
  .chef-txt p{margin:0;color:var(--ink-2);font-size:15px}
  .quote-mark{font-family:'Alexandria',sans-serif;font-size:44px;color:var(--gold);line-height:0;opacity:.5}

  .toolbar{max-width:1140px;margin:18px auto 0;padding:0 18px}
  .toolbar-card{background:var(--card);border-radius:20px;box-shadow:var(--sh-sm);padding:14px 18px;display:grid;gap:12px}
  .search{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px}

    grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

    display:flex;flex-direction:column;transition:transform .22s, box-shadow .22s;animation:up .4s ease both}
  .dish:hover{transform:translateY(-5px);box-shadow:var(--sh-md)}

  .price-tag{position:absolute;bottom:12px;inset-inline-start:12px;background:var(--card);color:var(--green);

  .dish-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}

  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.wa{background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
  .field{display:grid;gap:5px}

    font-family:'Rubik',sans-serif;font-size:16px;background:var(--card);color:var(--ink)}
  .input:focus{outline:none;border-color:var(--gold)}
  textarea.input{resize:vertical}

  .notice{max-width:1104px;margin:16px auto 0;border-radius:14px;padding:12px 18px;font-size:14px;
    display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
  .notice.info{background:var(--gold-soft);color:var(--green);border:1px solid #EDD9A3}
  .notice.err{background:var(--red-soft);color:var(--red);border:1px solid #EBC4BB}

  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;
    border-radius:999px;padding:11px 22px;font-size:14px;box-shadow:var(--sh-lg);animation:toast 2.4s ease both;pointer-events:none;white-space:nowrap}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}

  .skel{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh-sm)}
  .skel .a{height:200px}.skel .b{height:18px;margin:16px 18px 8px;border-radius:8px;width:60%}
  .skel .c{height:12px;margin:0 18px 18px;border-radius:8px}

    background-size:200% 100%;animation:shine 1.3s infinite}
  @keyframes shine{to{background-position:-200% 0}}

  .overlay{position:fixed;inset:0;background:rgba(15,35,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:dim .2s ease}
  @keyframes dim{from{opacity:0}}
  .sheet{background:var(--card);width:100%;max-width:540px;max-height:90vh;overflow:auto;
    border-radius:26px 26px 0 0;padding:24px 22px;animation:rise .28s ease}
  @keyframes rise{from{transform:translateY(30px);opacity:0}}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:26px}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .xbtn{width:38px;height:38px;border:none;background:var(--bg);border-radius:12px;font-size:17px;color:var(--ink-2)}
  .cart-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .cart-row img{width:56px;height:56px;object-fit:cover;border-radius:12px}
  .total-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);
    border-radius:14px;padding:14px 16px;margin:14px 0;font-family:'Alexandria',sans-serif;font-weight:800;font-size:17px}
  .cod{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border:1px solid #EDD9A3;border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0 14px}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-2)}
  .empty .big{font-size:52px;margin-bottom:8px}
  .adminbar{position:sticky;top:62px;z-index:25;background:var(--gold);color:var(--ink);padding:8px 18px;
    display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-wrap:wrap}
  .adminbar button{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600}
  .sync{font-size:12px;font-weight:500;border-radius:999px;padding:3px 12px;background:rgba(20,50,46,.1)}
  .foot{max-width:1140px;margin:0 auto;padding:0 18px 40px;text-align:center;color:var(--ink-3);font-size:13px}
</style>

<script>
(function () {
  const ROOT = document.getElementById('app-root');
  const IMG_EXT = /\.(jpe?g|png|webp|gif)$/i;
  const CHEF_RE = /^chef/i;                 // أي صورة اسمها يبدأ بـ chef تعتبر صورة الشيف
  const MENU_FILE = 'menu.json';

  /* ---------- التصنيفات (عربي/إنجليزي) ---------- */
  const CATS = [
    {k:'سلطات',en:'Salads'},{k:'أطباق رئيسية',en:'Main dishes'},{k:'ساندويتشات',en:'Sandwiches'},

    {k:'مشروبات',en:'Drinks'},{k:'أخرى',en:'Other'},
  ];
  const catLabel = k => S.lang==='ar' ? k : (CATS.find(c=>c.k===k)?.en || k);

  /* ---------- نصوص الواجهة ---------- */
  const T = {

    heroSub:['وجبات طازجة محضّرة بحب. اختر، اطلب عبر واتساب، ونوصلها إلى بابك.','Fresh meals made with love. Choose, order on WhatsApp, delivered to your door.'],
    chefRole:['الشيف','THE CHEF'],
    welcomeDefaultAr:'مرحباً بكم في مطبخنا! كل طبق نحضّره بمكونات طازجة وبكل حب، كما لو كنا نطبخ لعائلتنا. تشرفنا بخدمتكم!',
    welcomeDefaultEn:'Welcome to our kitchen! Every dish is made with fresh ingredients and lots of love, as if we were cooking for our own family. It is an honor to serve you!',
    search:['ابحث عن وجبة…','Search for a dish…'],
    all:['الكل','All'],
    add:['أضف إلى السلة','Add to cart'],
    added:['✅ أُضيفت إلى السلة','✅ Added to cart'],
    cart:['🧺 السلة','🧺 Cart'],
    cartTitle:['🧺 سلتك','🧺 Your cart'],
    cartEmpty:['سلتك فارغة — أضف بعض الوجبات الشهية 😋','Your cart is empty — add some tasty dishes 😋'],
    total:['المجموع','Total'],
    currency:['د.م','MAD'],
    dirham:['درهم','MAD'],
    delivery:['🛵 معلومات التوصيل','🛵 Delivery details'],
    name:['الاسم الكامل *','Full name *'],
    phone:['رقم الهاتف *','Phone number *'],
    address:['عنوان التوصيل *','Delivery address *'],
    notes:['ملاحظات (اختياري)','Notes (optional)'],
    notesPh:['مثال: بدون بصل','e.g. no onions'],
    cod:['الدفع نقداً عند الاستلام — لا حاجة لبطاقة بنكية.','Cash on delivery — no bank card needed.'],
    waOrder:['أرسل الطلب عبر واتساب','Send order on WhatsApp'],
    fillAll:['⚠️ املأ الاسم والهاتف والعنوان','⚠️ Please fill name, phone and address'],
    admin:['👤 المدير','👤 Admin'],
    adminLogin:['👤 دخول المدير','👤 Admin login'],
    pin:['الرمز السري','PIN code'],
    login:['دخول','Log in'],
    wrongPin:['الرمز غير صحيح','Wrong PIN'],
    adminOn:['🛠️ وضع المدير مفعّل','🛠️ Admin mode on'],
    logout:['خروج','Log out'],
    refresh:['🔄 تحديث الصور','🔄 Refresh photos'],
    settings:['⚙️ الإعدادات','⚙️ Settings'],
    classifying:['الذكاء الاصطناعي يتعرّف على الوجبات الجديدة…','AI is identifying new dishes…'],
    classified:['✅ تم تصنيف الوجبات الجديدة','✅ New dishes classified'],
    edit:['✏️','✏️'],
    save:['💾 حفظ','💾 Save'],
    saved:['💾 تم الحفظ','💾 Saved'],
    reclass:['🤖 صنّف من جديد','🤖 Re-classify'],
    reclassing:['⏳ جارٍ التصنيف…','⏳ Classifying…'],
    reclassOk:['🤖 تم التصنيف من جديد','🤖 Re-classified'],
    reclassFail:['⚠️ تعذر التصنيف، حاول مجدداً','⚠️ Classification failed, try again'],
    cancel:['إلغاء','Cancel'],
    hide:['إخفاء هذه الوجبة عن الزوار','Hide this dish from visitors'],
    hidden:['مخفية','hidden'],
    nameAr:['الاسم (عربي)','Name (Arabic)'],
    nameEn:['الاسم (إنجليزي)','Name (English)'],
    descAr:['الوصف (عربي)','Description (Arabic)'],
    descEn:['الوصف (إنجليزي)','Description (English)'],
    price:['السعر (درهم)','Price (MAD)'],
    category:['التصنيف','Category'],
    noResults:['لا نتائج مطابقة','No matching results'],
    tryOther:['جرّب كلمة أخرى أو اختر تصنيف «الكل».','Try another word or choose "All".'],
    noDishes:['لا توجد وجبات بعد','No dishes yet'],
    addToRepo:['أضف صور وجباتك إلى مجلد GitHub ثم اضغط «تحديث الصور».','Add your dish photos to the GitHub folder then press "Refresh photos".'],
    footer:['💵 الدفع نقداً عند الاستلام · الصور تُحدَّث تلقائياً من مجلد GitHub','💵 Cash on delivery · Photos update automatically from the GitHub folder'],
    stName:['اسم المطعم','Restaurant name'],
    stWa:['رقم واتساب لاستقبال الطلبات (بالصيغة الدولية)','WhatsApp number for orders (international format)'],
    stWelAr:['كلمة ترحيبية للزبناء (عربي)','Welcome message (Arabic)'],
    stWelEn:['كلمة ترحيبية للزبناء (إنجليزي)','Welcome message (English)'],
    stToken:['رمز GitHub للحفظ في المستودع (اختياري)','GitHub token to save into the repo (optional)'],
    stTokenHint:['أنشئه من GitHub → Settings → Developer settings → Fine-grained tokens، بصلاحية Contents: Read and write على هذا المستودع فقط. يُحفظ في حسابك أنت فقط.','Create it from GitHub → Settings → Developer settings → Fine-grained tokens, with Contents: Read and write on this repo only. Stored only in your own account.'],
    saveSettings:['💾 حفظ الإعدادات','💾 Save settings'],
    pushRepo:['⬆️ احفظ القائمة في المستودع الآن','⬆️ Save menu to repo now'],
    pushed:['✅ تم الحفظ في المستودع (menu.json)','✅ Saved to repo (menu.json)'],
    pushFail:['⚠️ تعذر الحفظ في المستودع — تحقق من الرمز وصلاحياته','⚠️ Repo save failed — check token & permissions'],
    synced:['✓ محفوظ في المستودع','✓ Synced to repo'],
    notSynced:['⚠ تغييرات غير محفوظة في المستودع','⚠ Unsaved repo changes'],
    noToken:['أضف رمز GitHub في الإعدادات ليُحفظ تلقائياً','Add a GitHub token in Settings for auto-save'],
    orderMsgTitle:['🛒 طلب جديد من','🛒 New order from'],
    customer:['الزبون','Customer'],
    thanks:['شكراً! سنؤكد طلبك على واتساب.','Thank you! We will confirm your order on WhatsApp.'],
  };
  const t = k => Array.isArray(T[k]) ? T[k][S.lang==='ar'?0:1] : T[k];

  /* ---------- الحالة ---------- */
  const S = {
    phase:'loading', lang:'ar', cfg:null,
    data:{ settings:{ name:'', whatsapp:'', welcome_ar:'', welcome_en:'' }, items:{} },
    files:[], chefImgs:[], sha:null, dirty:false, saving:false,
    error:'', classifying:null, cat:'الكل', q:'', cart:{},
    admin:false, editing:null, modal:null,
  };

  /* ---------- تخزين ---------- */
  async function sGet(k, shared=true){ try{ const r = await window.storage.get(k, shared); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
  async function sSet(k, v, shared=true){ try{ await window.storage.set(k, JSON.stringify(v), shared); }catch(e){ console.error(e); } }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){ const el = document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2500); }
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

  const iname = it => S.lang==='ar' ? (it.name_ar || it.name || '') : (it.name_en || it.name_ar || it.name || '');
  const idesc = it => S.lang==='ar' ? (it.desc_ar || it.description || '') : (it.desc_en || it.desc_ar || it.description || '');

  function parseRepoUrl(url){
    try{
      let u = url.trim().replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\/+$/,'');
      const p = u.split('/').filter(Boolean);
      if (p.length < 2) return null;
      const owner=p[0], repo=p[1]; let branch='main', path='';
      if (p[2]==='tree' && p.length>3){ branch=p[3]; path=p.slice(4).join('/'); }
      else if (p.length>2){ path=p.slice(2).join('/'); }
      return {owner,repo,branch,path};
    }catch(e){ return null; }
  }
  const menuPath = () => (S.cfg.path ? S.cfg.path + '/' : '') + MENU_FILE;

  /* ---------- GitHub ---------- */
  async function listImages(cfg){
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status===404
      ? (S.lang==='ar' ? 'المجلد غير موجود — تأكد من الرابط ومن أن المستودع عام (Public)' : 'Folder not found — check the link and that the repo is Public')
      : 'GitHub error ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(S.lang==='ar' ? 'الرابط لا يشير إلى مجلد' : 'Link is not a folder');
    return data.filter(f => f.type==='file' && IMG_EXT.test(f.name)).map(f => ({name:f.name, url:f.download_url}));
  }

  async function loadRepoMenu(){
    try{
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`);
      if (!res.ok){ S.sha = null; return null; }
      const j = await res.json();
      S.sha = j.sha;
      return JSON.parse(b64dec(j.content));
    }catch(e){ return null; }
  }

  async function pushRepoMenu(){
    const token = await sGet('gh_token', false);   // شخصي — لا يُشارك مع الزوار
    if (!token) return {ok:false, reason:'no_token'};
    S.saving = true; render();
    try{
      // احصل على sha الحالي دائماً قبل الحفظ
      const head = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}?ref=${S.cfg.branch}`,
        { headers:{ Authorization:'Bearer '+token } });
      let sha = null;
      if (head.ok){ sha = (await head.json()).sha; }
      const body = { message:'Update menu from website', branch:S.cfg.branch, content:b64enc(JSON.stringify(S.data, null, 2)) };
      if (sha) body.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${menuPath()}`,
        { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      S.saving = false;
      if (!res.ok){ render(); return {ok:false}; }
      const j = await res.json();
      S.sha = j.content && j.content.sha;
      S.dirty = false; render();
      return {ok:true};
    }catch(e){ S.saving=false; render(); return {ok:false}; }
  }

  async function persist(){
    S.dirty = true;
    await sSet('data', S.data);                 // نسخة احتياطية مشتركة دائماً
    const r = await pushRepoMenu();             // ثم في المستودع إن وُجد الرمز
    if (r.ok) toast(t('pushed'));
    else if (r.reason !== 'no_token') toast(t('pushFail'));
    render();
  }

  /* ---------- التصنيف الذكي ---------- */
  async function imageToSmallBase64(url){
    const blob = await (await fetch(url)).blob();
    const bmp = await createImageBitmap(blob);
    const max=700, sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',0.8).split(',')[1];
  }

  async function classifyImage(url){
    const b64 = await imageToSmallBase64(url);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:1200,
        messages:[{role:'user', content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
          {type:'text', text:
`انظر جيداً إلى محتوى هذه الصورة: إنها وجبة تُباع في مطعم. تعرّف بدقة على الطبق ومكوناته الظاهرة.
أجب فقط بكائن JSON دون أي نص آخر ودون علامات Markdown:
{"name_ar":"اسم الوجبة الحقيقي بالعربية (مثل: سلطة مغربية، طاجين لحم، كسكس بالخضار)","name_en":"the real dish name in English","category":"واحدة فقط من: ${CATS.map(c=>c.k).join('، ')}","desc_ar":"وصف شهي بالعربية من جملة إلى جملتين يذكر المكونات الظاهرة","desc_en":"an appetizing 1-2 sentence English description mentioning visible ingredients","price":سعر مقترح كرقم بالدرهم المغربي}`}
        ]}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    const obj = JSON.parse(text.replace(/```json|```/g,'').trim());
    if (!CATS.some(c=>c.k===obj.category)) obj.category = 'أخرى';
    obj.price = Number(obj.price) || 0;
    return obj;
  }

  function applyDir(){

  async function refresh(){
    S.error=''; render();
    let imgs;
    try{ imgs = await listImages(S.cfg); }
    catch(e){ S.error = e.message; render(); return; }
    S.chefImgs = imgs.filter(f => CHEF_RE.test(f.name));
    S.files = imgs.filter(f => !CHEF_RE.test(f.name));
    // الجديد + ما فشل تصنيفه سابقاً
    const fresh = S.files.filter(f => !S.data.items[f.name] || S.data.items[f.name].failed);
    render();
    if (!fresh.length) return;
    S.classifying = {done:0, total:fresh.length}; render();
    let changed = false;
    for (let i=0;i<fresh.length;i++){
      let ok = false;
      for (let attempt=0; attempt<2 && !ok; attempt++){   // محاولتان لكل صورة
        try{
          const info = await classifyImage(fresh[i].url);
          S.data.items[fresh[i].name] = Object.assign({hidden:false}, info);
          ok = true; changed = true;
        }catch(e){ /* أعد المحاولة */ }
      }
      if (!ok){
        S.data.items[fresh[i].name] = { name_ar:'وجبة', name_en:'Dish', category:'أخرى', desc_ar:'', desc_en:'', price:0, hidden:false, failed:true };
      }
      await sSet('data', S.data);
      S.classifying = {done:i+1, total:fresh.length}; render();
    }
    S.classifying = null;
    if (changed){ S.dirty = true; const r = await pushRepoMenu(); if (r.ok) toast(t('pushed')); }
    render();
    toast(t('classified'));
  }

          <div class="cod">💵 <span>${t('cod')}</span></div>
          <button class="btn wa" id="wa-order" style="width:100%;padding:15px;font-size:16px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4l-2.1-1c-.3-.1-.5-.1-.7.1l-1 1.2c-.2.2-.4.2-.6.1-1.6-.8-3-2.1-3.8-3.8-.1-.2-.1-.4.1-.6l1.2-1c.2-.2.2-.4.1-.7l-1-2.1c-.2-.4-.5-.5-.9-.4-1.2.4-2 1.6-1.8 2.8.5 3.9 3.6 7 7.5 7.5 1.2.2 2.4-.6 2.8-1.8.1-.4 0-.7-.4-.9zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5-1.3c1.5.8 3.2 1.3 5 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.3c-1.6 0-3.1-.5-4.4-1.2l-.3-.2-3 .8.8-3-.2-.3c-.8-1.3-1.2-2.9-1.2-4.4 0-4.6 3.7-8.3 8.3-8.3s8.3 3.7 8.3 8.3-3.7 8.3-8.3 8.3z"/></svg>
            ${t('waOrder')} — ${cartTotal()} ${t('dirham')}
          </button>` : ''}
      </div></div>`;
    }

    if (S.modal==='login'){
      return `
      <div class="overlay" data-close="1"><div class="sheet" style="max-width:400px">
        <div class="sheet-head"><h2>${t('adminLogin')}</h2><button class="xbtn" data-close="1">✕</button></div>
        <div class="field"><label>${t('pin')}</label><input class="input" id="pin-in" type="password"></div>
        <p id="pin-err" style="color:var(--red);font-size:14px;margin:8px 0 0"></p>
        <button class="btn" id="pin-go" style="width:100%;margin-top:14px">${t('login')}</button>
      </div></div>`;
    }

    if (S.modal==='settings'){
      const st = S.data.settings;
      return `
      <div class="overlay" data-close="1"><div class="sheet">
        <div class="sheet-head"><h2>${t('settings')}</h2><button class="xbtn" data-close="1">✕</button></div>
        <div style="display:grid;gap:12px">
          <div class="field"><label>${t('stName')}</label><input class="input" id="st-name" value="${esc(st.name||'')}"></div>
          <div class="field"><label>${t('stWa')}</label><input class="input" id="st-wa" dir="ltr" style="text-align:left" inputmode="tel" value="${esc(st.whatsapp||'')}"></div>
          <div class="field"><label>${t('stWelAr')}</label><textarea class="input" id="st-wel-ar" rows="3" placeholder="${esc(T.welcomeDefaultAr)}">${esc(st.welcome_ar||'')}</textarea></div>
          <div class="field"><label>${t('stWelEn')}</label><textarea class="input" id="st-wel-en" dir="ltr" style="text-align:left" rows="3" placeholder="${esc(T.welcomeDefaultEn)}">${esc(st.welcome_en||'')}</textarea></div>
          <div class="field"><label>${t('stToken')}</label>
            <input class="input" id="st-token" type="password" dir="ltr" style="text-align:left" placeholder="github_pat_…">
            <span style="font-size:12px;color:var(--ink-3)">${t('stTokenHint')}</span></div>
          <button class="btn" id="st-save" style="width:100%">${t('saveSettings')}</button>
          <button class="btn gold" id="st-push" style="width:100%">${t('pushRepo')}</button>
        </div>
      </div></div>`;
    }
    return '';
  }

  /* ---------- الأحداث ---------- */
  function bind(){
    const $ = id => document.getElementById(id);
    const all = (sel,fn) => ROOT.querySelectorAll(sel).forEach(fn);

    if ($('lang-toggle')) $('lang-toggle').onclick = async () => {
      S.lang = S.lang==='ar' ? 'en' : 'ar';
      await sSet('lang', S.lang, false);
      render();
    };

    const si = $('search-in');
    if (si){
      let tm;
      si.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { S.q = si.value; render();
        const n = $('search-in'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} }, 350); };
    }
    if ($('clear-q')) $('clear-q').onclick = () => { S.q=''; render(); };

    all('[data-cat]', b => b.onclick = () => { S.cat=b.dataset.cat; render(); });
    all('[data-add]', b => b.onclick = () => { S.cart[b.dataset.add]=1; render(); toast(t('added')); });
    all('[data-inc]', b => b.onclick = () => { S.cart[b.dataset.inc]++; render(); });
    all('[data-dec]', b => b.onclick = () => { const k=b.dataset.dec; S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });
    all('[data-edit]', b => b.onclick = () => { S.editing=b.dataset.edit; render(); });
    all('[data-cancel]', b => b.onclick = () => { S.editing=null; render(); });

    all('[data-save]', b => b.onclick = async () => {
      const k = b.dataset.save;
      S.data.items[k] = {
        name_ar:$('ed-name-ar').value, name_en:$('ed-name-en').value,
        category:$('ed-cat').value,
        desc_ar:$('ed-desc-ar').value, desc_en:$('ed-desc-en').value,
        price:Number($('ed-price').value)||0,
        hidden:$('ed-hidden').checked,
      };
      S.editing=null;
      toast(t('saved'));
      await persist();
    });

    all('[data-reclass]', b => b.onclick = async () => {
      const k = b.dataset.reclass, f = fileOf(k);
      b.disabled=true; b.textContent=t('reclassing');
      try{
        const info = await classifyImage(f.url);
        S.data.items[k] = Object.assign({hidden:items()[k]?.hidden||false}, info);
        S.editing=null;
        toast(t('reclassOk'));
        await persist();
      }catch(e){ toast(t('reclassFail')); S.editing=null; render(); }
    });

    ['do-refresh2','do-refresh3','retry'].forEach(id => { if ($(id)) $(id).onclick = refresh; });
    if ($('push-now')) $('push-now').onclick = async () => {
      const r = await pushRepoMenu();
      toast(r.ok ? t('pushed') : (r.reason==='no_token' ? t('noToken') : t('pushFail')));
    };
    if ($('open-cart')) $('open-cart').onclick = () => { S.modal='cart'; render(); };
    if ($('open-login')) $('open-login').onclick = () => { S.modal='login'; render(); };
    if ($('open-settings')) $('open-settings').onclick = () => { S.modal='settings'; render(); };
    if ($('logout')) $('logout').onclick = () => { S.admin=false; S.editing=null; render(); };

    all('.overlay', ov => ov.onclick = e => { if (e.target===ov){ S.modal=null; render(); } });
    all('.sheet [data-close]', b => b.onclick = () => { S.modal=null; render(); });

    all('[data-inc-m]', b => b.onclick = () => { const k=b.getAttribute('data-inc-m'); S.cart[k]++; render(); });
    all('[data-dec-m]', b => b.onclick = () => { const k=b.getAttribute('data-dec-m'); S.cart[k]--; if(S.cart[k]<=0) delete S.cart[k]; render(); });

    if ($('wa-order')) $('wa-order').onclick = function(){
      const c = { name:$('c-name').value.trim(), phone:$('c-phone').value.trim(),
                  address:$('c-addr').value.trim(), notes:$('c-notes').value.trim() };
      if (!c.name || !c.phone || !c.address){ toast(t('fillAll')); return; }
      sendWhatsApp(c);
    };

    if ($('pin-go')){
      const go = () => {
        if ($('pin-in').value === S.cfg.pin){ S.admin=true; S.modal=null; render(); toast(t('adminOn')); }
        else $('pin-err').textContent = t('wrongPin');
      };
      $('pin-go').onclick = go;
      $('pin-in').onkeydown = e => { if (e.key==='Enter') go(); };
      setTimeout(() => { const p=$('pin-in'); if(p) p.focus(); }, 50);
    }

    if ($('st-save')) $('st-save').onclick = async () => {
      S.data.settings = Object.assign({}, S.data.settings, {
        name:$('st-name').value.trim(),
        whatsapp:$('st-wa').value.trim(),
        welcome_ar:$('st-wel-ar').value.trim(),
        welcome_en:$('st-wel-en').value.trim(),
      });
      const tok = $('st-token').value.trim();
      if (tok) await sSet('gh_token', tok, false);   // شخصي فقط — لا يُشارك أبداً
      S.modal=null;
      toast(t('saved'));
      await persist();
    };
    if ($('st-push')) $('st-push').onclick = async () => {
      const tok = $('st-token').value.trim();
      if (tok) await sSet('gh_token', tok, false);
      const r = await pushRepoMenu();
      toast(r.ok ? t('pushed') : (r.reason==='no_token' ? t('noToken') : t('pushFail')));
    };
  }

  boot();
})();
</script>
